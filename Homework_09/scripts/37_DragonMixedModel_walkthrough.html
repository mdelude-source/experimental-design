<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixed Effects Models — Professor Nugget</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { width: 960px; max-width: 98vw; padding: 16px; }
.progress-bar { height: 6px; background: #333; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #f7971e, #ffd200); border-radius: 3px; transition: width 0.4s ease; }
.top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.slide-counter { font-size: 12px; color: #888; }
.voice-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.voice-btn { background: transparent; border: 1px solid #555; border-radius: 6px; color: #ccc; font-size: 12px; padding: 4px 10px; cursor: pointer; transition: all 0.2s; }
.voice-btn:hover { border-color: #f7971e; color: #f7971e; }
.voice-btn.active { background: rgba(247,151,30,0.15); border-color: #f7971e; color: #f7971e; }
.voice-btn:disabled { opacity: 0.4; cursor: default; }
.speed-select { background: #1a1a2e; border: 1px solid #555; border-radius: 6px; color: #ccc; font-size: 12px; padding: 4px 6px; cursor: pointer; }
.speaking-indicator { display: none; align-items: center; gap: 4px; font-size: 11px; color: #f7971e; }
.speaking-indicator.visible { display: flex; }
.bar { width: 3px; background: #f7971e; border-radius: 2px; animation: bounce 0.6s infinite alternate; }
.bar:nth-child(1) { height: 8px; } .bar:nth-child(2) { height: 14px; animation-delay: 0.15s; } .bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
@keyframes bounce { from { transform: scaleY(0.4); } to { transform: scaleY(1); } }
.card { background: #16213e; border-radius: 16px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: flex; gap: 24px; min-height: 340px; align-items: flex-start; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #f7971e, #ffd200); }
.presenter { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dog-img { width: 180px; height: 230px; object-fit: cover; border-radius: 12px; border: 3px solid #f7971e; box-shadow: 0 4px 16px rgba(247,151,30,0.3); transition: box-shadow 0.15s ease; }
.dog-img.talking { animation: dogTalk 0.35s ease-in-out infinite alternate; box-shadow: 0 0 0 4px #ffd200, 0 0 24px 8px rgba(247,151,30,0.6); }
@keyframes dogTalk { from { transform: scale(1) rotate(-1deg); } to { transform: scale(1.04) rotate(1deg); } }
.mouth-wrap { position: relative; display: inline-block; }
.mouth { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); width: 38px; height: 0; background: #1a0a00; border-radius: 0 0 14px 14px; border: 2px solid #8B4513; transition: height 0.12s ease; overflow: hidden; display: none; }
.mouth.open { height: 14px; }
.mouth-inner { width: 100%; height: 100%; background: linear-gradient(to bottom, #cc2200, #880000); border-radius: 0 0 12px 12px; }
.tongue { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 16px; height: 9px; background: #ff6688; border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%; }
.speech-bubble { position: relative; background: #ffd200; color: #000; font-size: 11px; font-weight: 800; border-radius: 10px; padding: 5px 10px; margin-top: 4px; text-align: center; display: none; animation: bubblePop 0.3s ease; }
.speech-bubble.visible { display: block; }
.speech-bubble::after { content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-bottom-color: #ffd200; }
@keyframes bubblePop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.dog-name { font-size: 11px; color: #f7971e; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.title-dog { width: 180px; height: 230px; border-radius: 14px; border: 4px solid #f7971e; box-shadow: 0 6px 30px rgba(247,151,30,0.4); margin: 14px auto; display: block; }
.title-dog.talking { animation: dogTalk 0.35s ease-in-out infinite alternate; box-shadow: 0 0 0 4px #ffd200, 0 0 30px 10px rgba(247,151,30,0.7); }
.content { flex: 1; min-width: 0; max-height: 72vh; overflow-y: auto; padding-right: 4px; }
.content::-webkit-scrollbar { width: 4px; } .content::-webkit-scrollbar-track { background: #0d1b2a; } .content::-webkit-scrollbar-thumb { background: #f7971e; border-radius: 2px; }
.section-tag { display: inline-block; background: rgba(247,151,30,0.15); color: #f7971e; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 6px; padding: 3px 10px; margin-bottom: 10px; border: 1px solid rgba(247,151,30,0.3); }
.slide-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 12px; line-height: 1.3; }
.slide-body { color: #ccc; line-height: 1.7; font-size: 14px; }
.slide-body p { margin-bottom: 10px; } .slide-body ul { padding-left: 18px; } .slide-body li { margin-bottom: 6px; } .slide-body strong { color: #ffd200; }
.slide-body table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.code-block { background: #0d1b2a; border-left: 3px solid #f7971e; border-radius: 8px; padding: 10px 14px; font-family: 'Cascadia Code','Fira Code',monospace; font-size: 12px; color: #a8d8ea; margin: 10px 0; overflow-x: auto; white-space: pre; line-height: 1.6; }
.kw { color: #c792ea; } .fn { color: #82aaff; } .str { color: #c3e88d; } .cm { color: #546e7a; font-style: italic; } .arg { color: #ffcb6b; }
.tip { background: rgba(130,210,255,0.08); border: 1px solid rgba(130,210,255,0.2); border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-size: 13px; color: #a8d8ea; }
.tip-label { font-weight: 700; color: #82aaff; }
.nav { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 12px; }
.btn { background: #f7971e; color: #000; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.btn:hover { background: #ffd200; transform: translateY(-1px); }
.btn:disabled { background: #444; color: #777; cursor: default; transform: none; }
.btn-outline { background: transparent; color: #f7971e; border: 2px solid #f7971e; }
.btn-outline:hover { background: #f7971e; color: #000; }
.dots { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #444; cursor: pointer; transition: all 0.2s; border: none; }
.dot.active { background: #f7971e; transform: scale(1.4); }
.dot:hover:not(.active) { background: #888; }
.card-inner { transition: opacity 0.25s ease; width: 100%; }
.card-inner.fade { opacity: 0; }
.big-title { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="top-row">
    <div class="slide-counter" id="counter">Slide 1 / 10</div>
    <div class="voice-controls">
      <div class="speaking-indicator" id="speakingIndicator"><div class="bar"></div><div class="bar"></div><div class="bar"></div><span style="font-size:11px;margin-left:2px">Nugget is speaking…</span></div>
      <select class="speed-select" id="speedSelect"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select>
      <select class="speed-select" id="voiceSelect" title="Choose voice" style="max-width:140px"><option value="">Default voice</option></select>
      <button class="voice-btn" id="playBtn" onclick="toggleSpeak()">▶ Read</button>
      <button class="voice-btn" id="stopBtn" onclick="stopSpeak()" disabled>■ Stop</button>
      <button class="voice-btn" id="autoBtn" onclick="toggleAuto()">⟳ Auto</button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
  <div class="card" id="card"><div class="card-inner" id="inner"></div></div>
  <div class="nav">
    <button class="btn btn-outline" id="prevBtn" onclick="changeSlide(-1)" disabled>← Back</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="nextBtn" onclick="changeSlide(1)">Next →</button>
  </div>
</div>

const slides = [{"tag": "Section 1–2 · Setup", "title": "Libraries, Data & Exploration", "narration": "Arf arf! Nugget is here! Nugget is ready! Section 1 loads six packages. lme4 provides lmer — the core function for fitting linear mixed effects models. lmerTest adds Satterthwaite p-values to lmer output — without this, lmer gives t-values but no p-values for fixed effects. It also provides the rand function for likelihood ratio tests of random effects. ggeffects provides ggpredict for computing marginal effect predictions from mixed models. sjPlot provides plot_model for caterpillar plots of random effects. And broom.mixed provides tidy and glance for converting lmer output to clean data frames. Section 2 loads the dragons RData file using load — not read.csv, because RData files already contain named R objects and load reads them directly into the environment without assignment. Then scale bodyLength to zero mean and unit variance before modelling — this improves numerical stability for the optimiser and makes the intercept meaningful as the predicted score when body length is average. Woof!", "body": "<p>Six packages and a critical pre-modelling step — scaling the predictor:</p><div class='code-block'><span class='fn'>library</span>(<span class='str'>lme4</span>)        <span class='cm'># lmer() — fits linear mixed effects models</span>\n<span class='fn'>library</span>(<span class='str'>lmerTest</span>)    <span class='cm'># Satterthwaite p-values + rand() for random effect LRT</span>\n<span class='fn'>library</span>(<span class='str'>ggeffects</span>)   <span class='cm'># ggpredict() — marginal predictions from mixed models</span>\n<span class='fn'>library</span>(<span class='str'>sjPlot</span>)      <span class='cm'># plot_model(type='re') — caterpillar plots</span>\n<span class='fn'>library</span>(<span class='str'>broom.mixed</span>) <span class='cm'># tidy() / glance() — clean output tables</span>\n\n<span class='cm'># load() reads .RData directly — no assignment needed</span>\n<span class='fn'>load</span>(<span class='str'>\"dragons.RData\"</span>)  <span class='cm'># creates 'dragons' in environment</span>\n<span class='fn'>head</span>(dragons)  <span class='cm'># testScore, bodyLength, mountainRange, site</span>\n\n<span class='cm'># Scale bodyLength: zero mean, unit SD</span>\n<span class='cm'># → improves optimizer stability; intercept = score at average length</span>\ndragons$bodyLength2 &lt;- <span class='fn'>scale</span>(dragons$bodyLength)</div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABW4AAAHGCAYAAADkNBKOAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAABAABJREFUeJzs3Xd4HNXVwOHfzGxVby6S5V7lggu2Md0GA6H33lsoAQIBUigJAULyQSghEEIPkAChYxyMMWBjwN3GXTbuvUlW3Trt+2OtVVtJK1nd530eP6Dd1eyd2dXcuWfOPVdJ7jHURgghhBBCCCGEEEIIIUS7obZ1A4QQQgghhBBCCCGEEEJUJ4FbIYQQQgghhBBCCCGEaGckcCuEEEIIIYQQQgghhBDtjARuhRBCCCGEEEIIIYQQop2RwK0QQgghhBBCCCGEEEK0MxK4FUIIIYQQQgghhBBCiHZGArdCCCGEEEIIIYQQQgjRzkjgVgghhBBCCCGEEEIIIdoZCdwKIYQQQgghhBBCCCFEOyOBWyGEEEIIIYQQQgghhGhnHG3dACHqcu9xIe49TgfAsqE8BNtLVeZu0XhtkZN1hdXvOyy6zceMdQ5+N90d1/ZPHWTQPdnm9cXOuF5/VG+DT64MctKrXpbt0gDY+0A5D33l4h/zXI3Ys8a159kzg4zMtjj+pYSDfo/m1CvN4qnTQ4zJMUlywwkve1m5R6v1uo+v9HN0bwsAw4LSIKwvVPlmg4PXFzspCiit3XQhhGhXKvq7uVtVzn6z+rn+kZNCnDrYYOxziY3aZmP7xOYwINPi7mPDHNvHJNVjs7tM4fO1Dp7+3kVxsPJc3zPVYvHtfq77wMPUNbEvRTXF5prDda4YbdAn3UI3YUepyrytGn/4ykXYbP2+Y3g3k29uDLBpv8IR/6j9edTsry8+TOfvZ4UY8mQi++vo6yqORYWADoV+hRW7VT5Y6eSzfA1o3L6muG1uOiLMp6ud/FTQPDkaVftyy4adpQrzt2n8aaaL7SXNmwcSz3GLV4rbZv29Pm6f4ua/y+O73hNCdAx7Hyhv8DUH+7c/vJvJqYMNnpvjImA0fD46ob/BHUeFGdzFwuOAveUKi3do/PU7Fxv3t++cuXuPC3HrBJ2+jye1yPYr+pGPVzm46WNPtecSXTar7/LhdR78Z3YwDrb//PhKP76wwhX/9R50Wxbd5qNXmg1ExtA7SxXmbt nWrs8N7uvbKb/hCLNz7tBTOffMU1icuZLnX3+fZx+5q8braprG3wuWcOJx/Zjz9z811u/PkJMHMeTkQdWWbdlawGXX3XVEr09VxxLGuUNP4fxhp7M4cyVvf/glD999E5XOPX1kX377Y26+5lKefvg/WC0Wbrv/yWAf+n9jc/421uduon/vHtUStyuy1nL7A09y9aUXcM+t16JpGrmbtvD+Z9/869faW/s2qURFhEsfPSGEEEKIeqaEt+oi9eBCCCGEEKLRUhSFz95+nr8XLuW1CZ+EOpw6uWrUCC467wzOvewGvF7fwZ/wLw0/6zRGnH06l11XM+FdX8aNHkmHtmnc+eDTDfaaQgghhBBHI6m4FUIIIYQQjZLRaKBtWgonDuxLfFwM30/9LdQh1SqldRKnnTSQlVnZ+Px+enbvzEXnnckP036v16QtwE+/zeKSEWcxsN8x/LVgSb2+FoDdZuWs007kgf+9XO+vJYQQQghxtJPErRBCCCGEaJRiY6J564VHKS4p45V3PiZvy7ZQh1Qrj8dDl47tOOeMk7HbrBTuLOar76by4Rff1ftre70+nnllAmFh9np/LYD4FrG8/9kklq1a0yCvJ4QQQghxNJNWCUIIIYQQQgghhBBCCNHIqKEOQAghhBBCCCGEEEIIIUR1krgVQgghhBBCCCGEEEKIRkYSt0IIIYQQQgghhBBCCNHISOJWCCGEEEIIIYQQQgghGhlJ3AohhBBCCCGEEEIIIUQjI4lbIYQQQgghhBBCCCGEaGQkcSuEEEIIIYQQQgghhBCNjCRuhRBCCCGEEEIIIYQQopGRxK0QQgghhBBCCCGEEEI0Mv8HrL6hSZQAyxwAAAAASUVORK5CYII=\" style=\"width:100%;border-radius:6px;display:block;\"><div style=\"font-size:10px;color:#888;margin-top:5px;font-style:italic;\">Left: test score distribution. Middle: naive OLS scatter — all ranges pooled (colour = range). Right: boxplot by range — very different baselines signal non-independence!</div></div>"}, {"tag": "Section 3 · Naive OLS", "title": "Model 1 — Naive OLS (The Wrong Model)", "narration": "Woof! I am such a smart boy! Yes I am! Section 3 fits the WRONG model first — ordinary linear regression treating all 480 dragons as independent. This is wrong but serves as a critical baseline showing WHAT GOES WRONG when we ignore the hierarchical structure. The naive lm formula is testScore tilde bodyLength2. In the summary output, bodyLength2 will likely appear significant — but this is SPURIOUS! The significance is driven by between-range confounding. Mountain ranges with larger dragons also happen to have higher baseline test scores — or the reverse. The OLS line is fitting a between-range pattern, not a within-range body length effect. The diagnostic plots reveal the problem: residuals vs fitted will show systematic patterns because the range-level clustering is not accounted for. After seeing the naive result, we plot coloured scatter and boxplots to show that mountain ranges cluster at very different positions — confirming the independence violation. Woof!", "body": "<p>Baseline model — ignores all grouping structure (deliberately wrong):</p><div class='code-block'><span class='cm'># Model 1: wrong but educational — serves as baseline</span>\nbasic.lm &lt;- <span class='fn'>lm</span>(testScore ~ bodyLength2, <span class='arg'>data</span>=dragons)\n<span class='fn'>summary</span>(basic.lm)\n<span class='cm'># bodyLength2 may appear significant — this is SPURIOUS!</span>\n<span class='cm'># Significance is driven by between-range confounding, not a true effect</span>\n\n<span class='cm'># Diagnostic plots — look for systematic patterns in residuals</span>\n<span class='fn'>par</span>(<span class='arg'>mfrow</span>=<span class='fn'>c</span>(1,2))\n<span class='fn'>plot</span>(basic.lm, <span class='arg'>which</span>=1)  <span class='cm'># Residuals vs Fitted</span>\n<span class='fn'>plot</span>(basic.lm, <span class='arg'>which</span>=2)  <span class='cm'># Normal Q-Q</span>\n<span class='fn'>par</span>(<span class='arg'>mfrow</span>=<span class='fn'>c</span>(1,1))</div><div class='tip'><span class='tip-label'>⚠️ Pseudoreplication:</span> Treating 480 clustered dragons as independent inflates the effective sample size. The OLS p-value for body length is anti-conservative — it sees a between-range pattern as a within-range effect.</div>"}, {"tag": "Section 4 · Diagnosing Violation", "title": "Diagnosing the Independence Violation", "narration": "Ruff ruff! I am a very good boy AND a very good professor! Section 4 shows how to diagnose the independence violation visually. Three plots are used. First: a boxplot of testScore tilde mountainRange — if boxes sit at very different heights, the range explains substantial variance in test score and observations within a range are correlated. Second: a scatter plot coloured by mountain range. If coloured groups separate clearly in body length AND test score simultaneously, mountain range confounds any naive body-length effect. Third: a faceted scatter with one panel per range and within-range regression lines. If each range shows a consistent slope direction — all positive or all negative — the body-length effect is real and consistent across ranges. If slopes vary dramatically across panels, a random slope model will be needed. These three plots together build the case for the mixed model: ranges differ in baseline score, observations within ranges are clustered, and the naive OLS is capturing between-range differences rather than a biological body-length effect. Woof!", "body": "<p>Three visualizations that prove the independence violation:</p><div class='code-block'><span class='cm'># Plot 1: boxplot by range — different medians = non-independence</span>\n<span class='fn'>boxplot</span>(testScore ~ mountainRange, <span class='arg'>data</span>=dragons,\n         <span class='arg'>col</span>=<span class='str'>\"lightblue\"</span>, <span class='arg'>las</span>=2)\n<span class='cm'># Very different box heights → range explains substantial variance</span>\n\n<span class='cm'># Plot 2: scatter coloured by range</span>\n<span class='fn'>ggplot</span>(dragons, <span class='fn'>aes</span>(<span class='arg'>x</span>=bodyLength, <span class='arg'>y</span>=testScore,\n              <span class='arg'>colour</span>=mountainRange)) +\n  <span class='fn'>geom_point</span>(<span class='arg'>alpha</span>=0.7) + <span class='fn'>theme_bw</span>()\n\n<span class='cm'># Plot 3: faceted scatter — within-range slopes</span>\n<span class='fn'>ggplot</span>(dragons, <span class='fn'>aes</span>(<span class='arg'>x</span>=bodyLength, <span class='arg'>y</span>=testScore)) +\n  <span class='fn'>facet_wrap</span>(~ mountainRange) +\n  <span class='fn'>geom_point</span>() + <span class='fn'>geom_smooth</span>(<span class='arg'>method</span>=<span class='str'>\"lm\"</span>)</div><div class='tip'><span class='tip-label'>💡 What to look for:</span> If boxes in the range boxplot are at very different heights, and coloured groups cluster in the scatter plot, a mixed model with mountain range as a random effect is needed.</div>"}, {"tag": "Section 5 · Why Not Fixed?", "title": "Model 2 — Why Not Fixed Effects for Range?", "narration": "Arf! Nugget knows this one! Nugget is so helpful! Before introducing mixed models, Section 5 shows the natural but flawed alternative: adding mountainRange as a FIXED effect. The formula is testScore tilde bodyLength2 plus mountainRange. This creates 7 dummy variables — one per range level minus the reference. After fitting, bodyLength2 will likely be non-significant, confirming that the naive OLS result was driven by between-range confounding. But adding fixed effects for range has four serious problems. One: it uses k minus 1 equals 7 extra degrees of freedom just for the grouping variable. Two: we cannot generalise to new mountain ranges not in our sample — the estimates are only for THESE specific 8 ranges. Three: it does not account for the site-within-range nesting. Four: it makes the model table cluttered. The correct solution is to treat mountain range as a RANDOM effect — model the VARIANCE across ranges rather than estimate specific coefficients for each one. This uses only 1 parameter — the random effect variance — instead of 7 dummy coefficients, and allows generalisation to unobserved ranges. Woof!", "body": "<p>The tempting but problematic alternative — fixed effects for range:</p><div class='code-block'><span class='cm'># Model 2: mountainRange as FIXED effect (wrong approach)</span>\nmountain.lm &lt;- <span class='fn'>lm</span>(testScore ~ bodyLength2 + mountainRange,\n                  <span class='arg'>data</span>=dragons)\n<span class='fn'>summary</span>(mountain.lm)\n<span class='cm'># bodyLength2 now non-significant → confirms naive result was spurious!</span>\n<span class='cm'># But this model has four problems:</span></div><table style='width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;'><thead><tr style='background:#1a3a5c;'><th style='padding:6px;border:1px solid #334;color:#f7971e;'>Problem</th><th style='padding:6px;border:1px solid #334;color:#f7971e;'>Fixed Effect Range</th><th style='padding:6px;border:1px solid #334;color:#f7971e;'>Random Effect Range</th></tr></thead><tbody><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>Parameters used</td><td style='padding:5px;border:1px solid #334;color:#ff6b6b;'>7 dummy coefficients</td><td style='padding:5px;border:1px solid #334;color:#c3e88d;'>1 variance parameter</td></tr><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>Generalisability</td><td style='padding:5px;border:1px solid #334;color:#ff6b6b;'>Only these 8 ranges</td><td style='padding:5px;border:1px solid #334;color:#c3e88d;'>Any mountain range</td></tr><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>Site nesting</td><td style='padding:5px;border:1px solid #334;color:#ff6b6b;'>Not accounted for</td><td style='padding:5px;border:1px solid #334;color:#c3e88d;'>Add (1|sample)</td></tr><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>Interpretation</td><td style='padding:5px;border:1px solid #334;color:#ff6b6b;'>Cluttered table</td><td style='padding:5px;border:1px solid #334;color:#c3e88d;'>Clean ICC summary</td></tr></tbody></table>"}, {"tag": "Section 6 · Random Intercept", "title": "Model 3 — Random Intercept for Mountain Range", "narration": "Woof woof woof! I am a very excited boy! Section 6 fits the first proper mixed model — a random intercept for mountain range. The lmer formula is testScore tilde bodyLength2 plus open paren 1 pipe mountainRange close paren. The bodyLength2 term is the FIXED effect — the average slope across all ranges. The open paren 1 pipe mountainRange close paren is the RANDOM intercept — each range gets its own baseline test score, modelled as draws from a normal distribution with mean 0 and variance sigma-squared-range. This is BETTER than the fixed effect approach because range baselines are treated as random draws from a population distribution, we can generalise to unobserved ranges, and only 2 extra parameters are needed — sigma-squared-range and sigma-squared-residual — versus 7 fixed coefficients. After fitting, compute the Intraclass Correlation Coefficient manually. ICC equals random variance divided by random plus residual variance. An ICC above 0.1 strongly justifies the random intercept. An ICC around 0.6 means 60 percent of test score variance is BETWEEN ranges — a very strong grouping effect. Woof!", "body": "<p>The first proper mixed model — one random intercept per mountain range:</p><div class='code-block'><span class='cm'># Model 3: random intercept for mountain range</span>\n<span class='cm'># (1|mountainRange) = each range has its own baseline test score</span>\n<span class='cm'># Ranges modelled as draws from N(0, σ²_range) — not estimated individually</span>\nmixed.lmer &lt;- <span class='fn'>lmer</span>(testScore ~ bodyLength2 + (1 | mountainRange),\n                    <span class='arg'>data</span>=dragons)\n<span class='fn'>summary</span>(mixed.lmer)\n\n<span class='cm'># Compute ICC — proportion of variance due to mountain range</span>\nvar_comp   &lt;- <span class='fn'>VarCorr</span>(mixed.lmer)\nrandom_var &lt;- <span class='fn'>as.numeric</span>(var_comp[[1]])       <span class='cm'># σ²_range</span>\nresid_var  &lt;- <span class='fn'>attr</span>(var_comp, <span class='str'>\"sc\"</span>)^2          <span class='cm'># σ²_residual</span>\nicc        &lt;- random_var / (random_var + resid_var)\n<span class='cm'># ICC > 0.1 → random intercept justified</span>\n<span class='cm'># ICC ~ 0.6 → 60% of variance is BETWEEN ranges!</span></div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABFYAAAHGCAYAAABeng+CAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAAA0GtJREFUeJzs3Xd4FNXbxvHvzJZsekINvUrviNIVBUUUUUHBgl3sWLFi74Wfvoq9d1QsWFEQBJWiINIE6Z2QUEPK1pn3j002hASSQCCQ3J/r4iLZnZ05OzvZOfPMc55jxNdpZSMiIiIiIiIiIqVmlncDRERERERERESOVgqsiIiIiIiIiIgcIAVWREREREREREQOkAIrIiIiIiIiIiIHSIEVEREREREREZEDpMCKiIiIiIiIiMgBUmBFREREREREROQAKbAiIiIiIiIiInKAFFgRERERERERETlACqyIiIiIiIiIiBwgBVakUvrgvBxmXZe1z+evONZP2uhMGiZbB7WdFwZ6mTYi+6DWUR6GtguQNjoz8m/57Zn8cGk2/ZsFy2T9CVE2o3r7aFat4P6tl2iRNjqTM1rkb2fEcX5OblJ4u3NuyOKJU31l0p69Ha2fm4iIyN5G9fax+o7MQo9XjbF5qK+Pmddmse6uTFaOyuTr4dlc0CGAadgFlj2+Xoj3zs1h8S1ZbLg7k39GZvHyIC/ta4X2u+0DPVfv69x/NBjaLsA5rQMH9No2NUOM6u0j2llw/+f1y6pE2/t4pYiUN2d5N0CkPHy52MlrZ/voUCvEP5sdhZ4/p3WQORtM1uw4uNjj/353E+M6ek+CQz/2kOEzqBpjc83xAd4/z8vQjz1MXXVwXx2JHptRvQMsSXOwbGv+Pt6SaXDaO9Gs3Jb/2IjjAkxa7uSXlQW3eennHnZ5jYNqx74c7Z+biIjI/jRKtvhyeA4OA16d7WL+ZhO3A3o1DPFIPx/bsw0mLgufdy/rHOCJ/j5+X+Ng9M9uNu82qRVvMbhNkM8vyKHZmLgyb9++zv1Hg2HtA2T5Db5c7Cr1a1vXtBjVO8Bbf7nJ2SOuNHmFk9PeMdnlLcOGikiZOvq+rUTKwMT/nGT6fJzTJlgosFIv0aJLPYu7J7oPeP0ep403aBx0YKa8zd/sYHtOOHjxx1oH/4zM4oougYMKrHic+w5Y+EMGczcWDnQVZdGWki13II72z01ERGR/Xj7Li9OAfm9Hk7o7/5w3dZWTt+a4SIgKn6tb1Qjx6Ck+Pl/o5MZvooC8GxoOvlrsol/ToyOrJK9fVl6vP1jbsg22ZR+6fo+IHDwFVqRSygmG78QMahnkgUlubPJPlme3DhK0YMK/TmrEWdxzop8eDULUiLPZvNvgmyVOnp3uxh/Kf03a6EwemeImyWMztF2QGJdN42fieGGgl/a1LE54PQagVOt7+Bc30S6bSzsFMU2bn5c7uXtiFNmB/OVS4i1G9/HTp3GIuCibDbsM3p3r4o2/8oNCQ9sFuPb4AI2rWuzINhi3wMlT09xYduk6CFl+gxXbTOonhTtb57UNMLxTgGbVLAxgcZrJw79EMW9T/ol/VG8f13UNcM6H0Tx2io82KRZP/urmwb5+AN4ekn/rpfOL4X0098ZsLh/v4bulTubckEX9JJsrugS4oks4rfbGb6L4dIGLOTdkMWm5k7t/ioqs4/TmQW7r5ad g": "Section 7 · Nested Intercepts", "title": "Model 4 — Nested Random Intercepts (Range + Site)", "narration": "Rowf! I am a very good boy and I know about nested random effects! Section 7 extends the model to account for sites within ranges. The critical step is creating a globally unique site identifier — because site labels a, b, c REPEAT across mountain ranges. Site a in Bavarian Alps is a completely different location from site a in Drakensberg! The within function creates a sample column by combining mountainRange and site with a colon operator, giving 24 unique range-colon-site identifiers. The WRONG model uses the raw site column: lmer with open paren 1 pipe mountainRange close paren plus open paren 1 pipe site close paren. This is CROSSED random effects — it incorrectly assumes site a appears in EVERY mountain range as the SAME location. The CORRECT model uses the sample factor: open paren 1 pipe mountainRange close paren plus open paren 1 pipe sample close paren. This is NESTED random effects — each site is unique to one range. After fitting, use rand from lmerTest to perform a likelihood ratio test for each random effect — p below 0.05 means that random effect captures real variance and should be kept. Woof!", "body": "<p>Extend the model to account for sites within ranges — critical to get nesting right:</p><div class='code-block'><span class='cm'># Create globally unique site identifier</span>\n<span class='cm'># site labels a/b/c repeat across ranges — need unique IDs!</span>\ndragons &lt;- <span class='fn'>within</span>(dragons,\n  sample &lt;- <span class='fn'>factor</span>(mountainRange:site))\n<span class='cm'># 8 ranges × 3 sites = 24 unique sample IDs</span>\n\n<span class='cm'># ❌ WRONG: (1|site) treats site 'a' across all ranges as ONE location</span>\nmixed.WRONG &lt;- <span class='fn'>lmer</span>(testScore ~ bodyLength2 +\n    (1|mountainRange) + (1|site), <span class='arg'>data</span>=dragons)\n\n<span class='cm'># ✓ CORRECT: (1|sample) uses the unique range:site factor</span>\nmixed.lmer2 &lt;- <span class='fn'>lmer</span>(testScore ~ bodyLength2 +\n    (1|mountainRange) + (1|sample), <span class='arg'>data</span>=dragons)\n<span class='fn'>summary</span>(mixed.lmer2)\n\n<span class='cm'># rand(): LRT for each random effect — keep if p < 0.05</span>\n<span class='fn'>rand</span>(mixed.lmer2)</div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABJIAAAHHCAYAAADklnL8AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAAA+mxJREFUeJzs3XWYVOX7x/H31HZ3sHR3d6MgaaGiKKIoYmH3zy5sv3YXgqigIIhII93ducR2d83M74+FYZfdZQdEBvTz8vK6ds55znPuc+bscuae57mPwTe6qR0REREREREREZFqGF0dgIiIiIiIiIiIXByUSBIREREREREREacokSQiIiIiIiIiIk5RIklERERERERERJyiRJKIiIiIiIiIiDhFiSQREREREREREXGKEkkiIiIiIiIiIuIUJZJERERERERERMQpSiSJiIiIiIiIiIhTlEgSERERERERERGnKJEkIiIiIiIiIiJOUSJJREREREREREScokSSiIiIiIiIiIg4RYkkERERERERERFxihJJIiIiIiIiIiLiFCWSRERERERERETEKUokiYiIiIiIiIiIU5RIEhERERERERERpyiRJCIiIiIiIiIiTlEiSUREREREREREnGJ2dQAiImeq+yW1efK1flitNm6/cioJx7JdHdIF59VPB9KqfRRrlh3hufvmujocERGRi0bbAF8W924PwMClG1memuHagC4wrfx9eKFZPVoF+BLkZgFg0LKNLEvJcG1gx23t35laXp4A+E1fVG37rCv6ABCbl0+Luav+0dhuqBnBJ22bADDpcDx3btj1j+7PGbO6taZnaCB/JqRyzaotrg5HLhJKJImcRw8814NLhzZ0vL535HT270p1vH7ytb50v6QOAG8/9xfzZ+6tdLtTJcZlc8vQnxyvLW4mrrqxOT371yUyxg8DkJVRQFJCDvt2pvLblO3EH81m5Ng2jLyjrVOxb1kXz+N3zD6jWFq0i+C1zwY71lmtNoqLrGRlFHI0NpM1Sw8zd8YeCvJLnIoBwGCAkWNLY161OPY/m0Rq0S6Clu0iAVi5OJYDe9LKrZ8+aTut2kfRsXsMjZqHsntbsivCFBGRvyHAYua2OtEMjAimvo8XniYjcfmFbM/K5eejicyMT8Fqt9M9JIDZ3duU29Zmt5NTYmV/bj4zjiXx4f6jFNpsFfbhYzZxW51ohkSG0MDHC2+zidTCYtamZ/HNoTjmJ6VV2AZgeHQYY+pE08zfGy+TifSiYhIKitiSmcPPRxNZnJzuaFvfx5NHG9WmR0gAoe5u5JZYSSsqZld2LuvSs3lrT6yj7RONa/NE4zqnPS8nkgM1vTzY1r9LuWMutNlIKyrm ified. Woof!", "body": "<p>Allow the body-length slope to vary by range and site:</p><div class='code-block'><span class='cm'># Model 5: random slopes — intercept AND slope vary by range/site</span>\n<span class='cm'># (1 + bodyLength2 | mountainRange/site) expands to:</span>\n<span class='cm'>#   (1 + bodyLength2 | mountainRange) + (1 + bodyLength2 | mountainRange:site)</span>\nmixed.ranslope &lt;- <span class='fn'>lmer</span>(\n  testScore ~ bodyLength2 +\n    (1 + bodyLength2 | mountainRange/site),\n  <span class='arg'>data</span>=dragons)\n<span class='fn'>summary</span>(mixed.ranslope)\n\n<span class='cm'># If convergence fails, remove the intercept-slope correlation:</span>\n<span class='cm'># (1 + bodyLength2 || mountainRange/site)  ← double pipe removes correlation</span>\n\n<span class='cm'># Random effects summary shows:</span>\n<span class='cm'>#   σ²_intercept (range) — how much baseline scores vary by range</span>\n<span class='cm'>#   σ²_slope (range)     — how much body-length effects vary by range</span>\n<span class='cm'>#   cor(intercept, slope) — are taller ranges also steeper?</span></div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABJIAAAH9CAYAAABBd1Y3AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAABAABJREFUeJzs3Xd8W9X9//HXvVfbUx6JR3ZIIIuZsAKUWQotZZRZoAU6aCm0QKEFCpSW0Ra+FFpKJz9WKYVSZtkEwl5J2EkImU7iPeShfaV7f3/Ili1P2ZYtyf48H4+W2LqSzr0a9+3POfccJa9yoYkQQgghhBBCCCGEEENQ090AIYQQQgghhBBCCJEdpJAkhBBCCCGEEEIIIZIihSQhhBBCCCGEEEIIkRQpJAkhhBBCCCGEEEKIpEghSQghhBBCCCGEEEIkRQpJQgghhBBCCCGEECIpUkgSQgghhBBCCCGEEEmRQpIQQgghhBBCCCGESIoUkoQQQgghhBBCCCFEUqSQJIQQQgghhBBCCCGSIoUkITLI5YeEaLjaG//f55d6+d+3/RwxNzLubXnlu37+eFxw3J+3p9N212m42kuR0xzW/RZ aOG6Mrv7FXUP2mgAAYNfITD0jMwGxxRVJAIZEWppJ48aU6ZD9f6Diwny9vOCdWA9pp8pKR+rIQ/dX5YpV8nV0aOoeFfrxScfoX2+8H9VAJEmvv/OhZp9ynPbf5/s7LKcbDZnWDB135CG6+fZ5UX8tAAAQGTLTrpGZgNiikQRgSBTk2/XwfbfK4WzW7x59Qhs2bYn1kHaqvb1dk3cbrx8dfbgyrRmqb3Do2ZcWaP4/Xor6a3u9Pt39u8eUtd1KJNFSXFSgv/79BX29/NsheT0AALBrZKZdIzMBscWtbQAAAAAAAIiIMdYDAAAAAAAAQGKgkQQAAAAAAICI0EgCAAAAAABARGgkAQAAAAAAICI0kgAAAAAAABARGkkAAAAAAACICI0kAAAAAAAARIRGEgAAAAAAACJCIwkAAAAAAAAR+X9vXvLaiN6UvwAAAABJRU5ErkJggg==\" style=\"width:100%;border-radius:6px;display:block;\"><div style=\"font-size:10px;color:#888;margin-top:5px;font-style:italic;\">Left: random intercept model — parallel lines (same slope, different baseline). Right: random slope model — lines vary in both intercept AND slope. Slope variability across panels reveals biological heterogeneity.</div></div>"}, {"tag": "Section 9 · Model Comparison", "title": "Testing Fixed Effects — REML vs ML", "narration": "Good question! Woof! Section 9 is the formal test of whether body length significantly predicts test score after accounting for the hierarchical structure. To test a FIXED effect, we compare a full model with bodyLength2 to a reduced model without it. CRITICAL: we must set REML equals FALSE — maximum likelihood — for both models. REML — Restricted Maximum Likelihood — gives unbiased variance estimates but REML log-likelihoods are not comparable across models with different fixed effects, because each REML likelihood is profiled over a different marginal distribution. ML log-likelihoods are directly comparable. Call anova with the reduced model first and the full model second. The output shows: Chisq — the likelihood ratio statistic equal to 2 times the difference in log-likelihoods; Pr greater than Chisq — if p is above 0.05 then body length does NOT significantly improve model fit after accounting for range and site, meaning the naive OLS result was SPURIOUS. For random effects, use rand from lmerTest — it correctly uses REML-based LRTs for random effects. For fixed effects, always use ML by setting REML equals FALSE. Woof!", "body": "<p>Compare full vs reduced model with ML (REML=FALSE) for fixed effect testing:</p><div class='code-block'><span class='cm'># CRITICAL: use REML=FALSE for comparing FIXED effects</span>\n<span class='cm'># REML log-likelihoods are NOT comparable across different fixed effects</span>\n<span class='cm'># ML log-likelihoods ARE directly comparable</span>\nfull.lmer &lt;- <span class='fn'>lmer</span>(testScore ~ bodyLength2 + (1|mountainRange) + (1|sample),\n                  <span class='arg'>data</span>=dragons, <span class='arg'>REML</span>=FALSE)\n\nreduced.lmer &lt;- <span class='fn'>lmer</span>(testScore ~ 1 + (1|mountainRange) + (1|sample),\n                     <span class='arg'>data</span>=dragons, <span class='arg'>REML</span>=FALSE)\n\n<span class='fn'>anova</span>(reduced.lmer, full.lmer)\n<span class='cm'># Chisq = 2 × (logLik_full − logLik_reduced)</span>\n<span class='cm'># p > 0.05 → bodyLength does NOT predict testScore after controlling for range+site</span>\n<span class='cm'># → The naive OLS result was SPURIOUS (between-range confounding!)</span></div><div class='tip'><span class='tip-label'>💡 REML rule:</span> Use REML=FALSE for <strong>fixed effect</strong> comparisons via anova(). Use REML=TRUE (default) for the final reported model and all random effect comparisons via rand().</div>"}, {"tag": "Section 10 · Results", "title": "Presenting Results — Plots & Tables", "narration": "I am a very excited boy! Section 10 shows how to present mixed model results. First: ggpredict from ggeffects computes the marginal fixed-effect prediction — the population-level fitted line averaged over random effects. Pass the model and terms equals bodyLength2. Plot the returned object with geom underscore ribbon for the standard error band and geom underscore line for the fitted line. Second: calling ggpredict with terms equals c of bodyLength2 and mountainRange and type equals random gives CONDITIONAL predictions — the fitted slope within each specific range, including its random intercept. Third: plot underscore model from sjPlot with type equals re draws a caterpillar plot — each point is the BLUP, the Best Linear Unbiased Predictor, for one range or site, with 95% confidence intervals. Groups whose CI excludes zero deviate significantly from the population average. Fourth: for the model table, use coef of summary for fixed effects and VarCorr for random effect variance components. Use AIC, BIC, logLik, and sigma directly — they always work reliably on lmer objects. Nugget is done! I am a very good boy! I explained everything! Yes I did! Woof woof woof!", "body": "<p>Three result visualizations and a clean model table:</p><div class='code-block'><span class='cm'># Marginal (population-level) prediction — averaged over random effects</span>\npred.mm &lt;- <span class='fn'>ggpredict</span>(mixed.lmer2, <span class='arg'>terms</span>=<span class='str'>\"bodyLength2\"</span>)\n<span class='fn'>ggplot</span>(pred.mm) +\n  <span class='fn'>geom_ribbon</span>(<span class='fn'>aes</span>(<span class='arg'>x</span>=x, <span class='arg'>ymin</span>=predicted-std.error,\n                     <span class='arg'>ymax</span>=predicted+std.error), <span class='arg'>fill</span>=<span class='str'>\"lightgrey\"</span>) +\n  <span class='fn'>geom_line</span>(<span class='fn'>aes</span>(<span class='arg'>x</span>=x, <span class='arg'>y</span>=predicted))\n\n<span class='cm'># Conditional predictions — per-range slopes (includes random intercepts)</span>\npred_cond &lt;- <span class='fn'>ggpredict</span>(mixed.lmer2,\n  <span class='arg'>terms</span>=<span class='fn'>c</span>(<span class='str'>\"bodyLength2\"</span>, <span class='str'>\"mountainRange\"</span>),\n  <span class='arg'>type</span>=<span class='str'>\"random\"</span>)\n<span class='fn'>plot</span>(pred_cond)\n\n<span class='cm'># Caterpillar plot of BLUPs with 95% CIs</span>\n<span class='fn'>plot_model</span>(mixed.ranslope, <span class='arg'>type</span>=<span class='str'>\"re\"</span>, <span class='arg'>show.values</span>=TRUE)</div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABJQAAAHGCAYAAAAi1NEeAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAABAABJREFUeJzs3Xd4FFUXwOHfzNb0SkIIvfcmTXqVooiKFMWOKGBDQcWuYPkERey9oQIWQFQE6b0jvUPopBLSt+98f2yyYUmABAkBct7n8ZHNzs7ce2ey2T1z7rlKUGx9DSGEEEIIIYQQQgghikgt7QYIIYQQQgghhBBCiKuLBJSEEEIIIYQQQgghRLFIQEkIIYQQQgghhBBCFIsElIQQQgghhBBCCCFEsUhASQghhBBCCCGEEEIUiwSUhBBCCCGEEEIIIUSxSEBJCCGEEEIIIYQQQhSLBJSEEEIIIYQQQgghRLFIQEkIIYQQQgghhBBCFIsElIQQQgghhBBCCCFEsehLuwFClJanO9p4uqOjwM93J6l0+sKfpBezeHWhkU/WGi9Lez7oa2VwEycbj6v0+c7/rGc1Nj+eQ2ywxsTlBiYuN/3n430/wEKwWePWH84+1vkVZVxm3Z1DuypuANwanMxQWHdMxxtLjBxPLxtx7LZVnPx+t5UeX/uxNV5X2s0RQgghhBBCiEtKAkqiTMtxQP8f/Xx+ZsmNMfX+1o9j6cplbU+WDVpUdFM51M3RtPzAS5vKbsoFaFidl7U5/8m6YyqvLjShU6BelJuxnW00r+Ci8xf+WJyXd1xLw7Z4Hb2/9WN/StkIoAkhhBBCCCHKFgkoiTJN02DTicKzR87185J0LF3F5YZb6jv5YHV+BtBtDRwsOaijTWXXZW/TxUq3Kt4xXH9cR44DPu5no1tNF3/tKfjWY9RpOFygUXLBJlXRUBVwuks+oJVlV0rlGhJCCCGEEEKIy0ECSkKcw5lTu57uaOPBlg4avBfgE4yoW87F8octDJpqZkmc59epe00nozvYqR/lJtsOf+3R8+pCEzmOogUxZu3U079hfkBJp2jcVNfJC/NNhQaUbqzjOV7NSDdpFoXfd+p5Y4kRmyv/eLUi3EzsY6V5rJuETIV3VxQ+Xa1WhJsXu9poV8WFToXVR3S8MN/E4dP/Pctmy0lPcKVKqGcq3MZHs1mwX8+JDIX7WziIDdaoPymA0xaNUe0dDGnqIDpQ42iawufrjUz51+Czvz51nLzY1UbFEI0dCSrPzjMx8y4LX6zPnxI46+4csu0Kf+7W80Q7O1XDNHp/65mCdqHzpFc1Xuhip199J+UCNNIsClviVUbONpNpUy74fGFT3kw6z2tuaeAk1E/jQIrKOyuM/L03/634g75WmsS4ee4fI+N72Kke7mZvssozc01sS5AAlRBCCCGEEOLKIAElUebpFM3nsUsDzsqSmbnDwNMdHXSp7mLBgfxfm1sbOEnOUlh2yPNF/6a6Tr68zcq0rXomLDMSHaTxUhc7IWYbD88yF6k9s3bpeaGrndqRbvalqHSu7sLPAP/s0zOht81n2561nHx9u5VZO/WMX2ykVqSb57vYiQ1xM3SGZyqfSafxy ixed models. Right: caterpillar plot of range random effects — BLUPs with 95% CIs; gold = CI excludes 0.</div></div>"}, {"tag": "Section 11 · Summary", "title": "Key Concepts Decision Guide", "narration": "Woof! Yes yes yes! Nugget can explain this! The final slide is the master summary. Twelve key concepts for mixed effects models. One: pseudoreplication — treating clustered observations as independent inflates effective n and produces false positives. Two: mixed models separate fixed effects — the effect of specific predictor levels — from random effects — variance across a population of grouping levels. Three: random intercept open paren 1 pipe group close paren gives each group its own baseline mean. Four: ALWAYS create unique site identifiers when site labels repeat across higher grouping levels — use mountainRange colon site. Five: use nested random effects open paren 1 pipe mountainRange close paren plus open paren 1 pipe sample close paren, NOT crossed effects with the raw repeating site labels. Six: random slopes allow the fixed-effect slope to vary by group. Seven: ICC equals sigma-squared-group divided by total — above 0.1 justifies random effects. Eight: for fixed effect comparisons, set REML equals FALSE. For random effect comparisons use rand. Nine: ggpredict with no type gives marginal population-level prediction. With type equals random gives conditional group-specific prediction. Ten: caterpillar plots from sjPlot show BLUPs and which groups deviate significantly from the population mean. Nugget is done! I am a very good boy! I explained everything! Yes I did! Woof woof woof!", "body": "<p>Twelve key concepts — your mixed model checklist:</p><ul><li>1️⃣ <strong>Pseudoreplication</strong> → treating clustered obs as independent; inflates n; use mixed models</li><li>2️⃣ <strong>Fixed vs random</strong> → fixed = specific levels; random = variance across a population of levels</li><li>3️⃣ <strong>(1|group)</strong> → random intercept; each group has its own baseline mean</li><li>4️⃣ <strong>Unique site IDs</strong> → mountainRange:site creates 24 unique IDs; raw 'site' only gives 3!</li><li>5️⃣ <strong>Nested ≠ Crossed</strong> → (1|range) + (1|sample) correct; (1|range) + (1|site) wrong</li><li>6️⃣ <strong>Random slopes</strong> → (1 + pred|group); slope varies by group; needs more data</li><li>7️⃣ <strong>ICC</strong> → σ²_group / total variance; ICC > 0.1 justifies random effect</li><li>8️⃣ <strong>REML=FALSE</strong> → required for anova() fixed-effect LRT; REML=TRUE for final model</li><li>9️⃣ <strong>rand()</strong> → LRT for each random effect; keep if p &lt; 0.05</li><li>🔟 <strong>ggpredict()</strong> → marginal = population average; type='random' = conditional per-group</li><li>1️⃣1️⃣ <strong>plot_model(type='re')</strong> → caterpillar plot of BLUPs with 95% CIs</li><li>1️⃣2️⃣ <strong>The key result</strong> → after controlling for range + site, body length does NOT predict dragon test score — the naive OLS result was spurious!</li></ul><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABR8AAAIdCAYAAAC0rgpZAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAABAABJREFUeJzs3XV4FFcXwOHfanbjriQ4wd21uLQUiralQClVKtTdW+r21VtKDW+LllLc3R0CCUkISYi7rX5/bLJJSAIJJSTAeZ+Hh2R25s6Z2c3M3TNXFC5Bza0IIYQQQgghhBBCCCHEVaas6QCEEEIIIYQQQgghhBA3Jkk+CiGEEEIIIYQQQgghqoUkH4UQQgghhBBCCCGEENVCko9CCCGEEEIIIYQQQohqIclHIYQQQgghhBBCCCFEtZDkoxBCCCGEEEIIIYQQolpI8lEIIYQQQgghhBBCCFEtJPkohBBCCCGEEEIIIYSoFpJ8FEIIIYQQQgghhBBCVAtJPgohhBBCCCGEEEIIIaqFJB+FEEIIIYQQQgghhBDVQpKPQgghhBBCCCGEEEKIaiHJRyGEEEIIIYQQQgghRLWQ5KMQQgghhBBCCCGEEKJaSPJRCCGEEEIIIYQQQghRLST5KIQQQgghhBBCCCGEqBaSfBRCCCGEEEIIIYQQQlQLST4KIYQQQgghhBBCCCGqhSQfhRBCCCGEEEIIIY const dogIntros=['Woof woof! I am a very good boy! ','Arf arf! Nugget is here! Nugget is ready! ','Woof! I am such a smart boy! Yes I am! Yes I am! ','Ruff ruff! I am a very good boy AND a very good professor! ','Arf! Nugget knows this one! Nugget is so helpful! ','Woof woof woof! I am a very excited boy! ','Rowf! I am a very good boy and I know mixed effects models! That is impressive for a dog! ','Woof! Yes yes yes! Nugget can explain this! I am such a good boy! '];
const barks=['Woof!','Arf!','Ruff!','Woof woof!','Grr... woof!','Arf arf!','Rowf!','Woof woof woof!'];
function getNarration(idx){const s=slides[idx];const intro=dogIntros[idx%dogIntros.length];const outros=[' Nugget is such a good teacher! Woof!',' I am a very good boy for explaining this! Woof woof!',' Yes yes yes! Nugget did it! I am so helpful!',' That is a very good slide! Nugget is very proud! Woof!',' I am a very smart boy! Did you know that? Yes! Woof woof!',' Nugget knows so many things! I am a very good boy!'];const isLast=idx===slides.length-1;const outro=isLast?' Nugget is done! I am a very good boy! I explained everything! Yes I did! Woof woof woof!':outros[idx%outros.length];return intro+(s.narration||'')+outro;}
let current=0,autoMode=false,autoTimer=null,mouthTimer=null;
const synth=window.speechSynthesis;
function populateVoices(){const voices=synth.getVoices();const sel=document.getElementById('voiceSelect');if(!sel)return;sel.innerHTML='<option value="">Default voice</option>';voices.forEach((v,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=v.name+' ('+v.lang+')';if(v.name.includes('Google UK English Male')||v.name==='Alex'||v.name==='Fred')opt.selected=true;sel.appendChild(opt);});}
if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=populateVoices;
populateVoices();
function getSelectedVoice(){const sel=document.getElementById('voiceSelect');if(!sel||sel.value==='')return null;return synth.getVoices()[parseInt(sel.value)]||null;}
function setTalking(on){const img=document.getElementById('dogImg'),mouth=document.getElementById('dogMouth'),bubble=document.getElementById('speechBubble');if(!img)return;if(on){img.classList.add('talking');if(mouth)mouth.style.display='block';if(bubble){bubble.classList.add('visible');bubble.textContent=barks[Math.floor(Math.random()*barks.length)];}if(mouthTimer)clearInterval(mouthTimer);let open=false;mouthTimer=setInterval(()=>{open=!open;if(mouth)mouth.classList.toggle('open',open);if(open&&bubble&&Math.random()>0.7)bubble.textContent=barks[Math.floor(Math.random()*barks.length)];},180);}else{img.classList.remove('talking');if(mouth){mouth.classList.remove('open');mouth.style.display='none';}if(bubble)bubble.classList.remove('visible');if(mouthTimer){clearInterval(mouthTimer);mouthTimer=null;}}}
function stopSpeak(){synth.cancel();setTalking(false);document.getElementById('speakingIndicator').classList.remove('visible');document.getElementById('playBtn').classList.remove('active');document.getElementById('playBtn').textContent='▶ Read';document.getElementById('stopBtn').disabled=true;if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
function speak(text,onEnd){synth.cancel();const utt=new SpeechSynthesisUtterance(text);utt.rate=1.0;utt.pitch=0.9;utt.volume=1;const sv=getSelectedVoice();if(sv)utt.voice=sv;document.getElementById('speakingIndicator').classList.add('visible');document.getElementById('playBtn').classList.add('active');document.getElementById('playBtn').textContent='❙❙ Pause';document.getElementById('stopBtn').disabled=false;setTalking(true);utt.onend=()=>{setTalking(false);document.getElementById('speakingIndicator').classList.remove('visible');document.getElementById('playBtn').classList.remove('active');document.getElementById('playBtn').textContent='▶ Read';document.getElementById('stopBtn').disabled=true;if(onEnd)onEnd();};utt.onerror=()=>{setTalking(false);document.getElementById('speakingIndicator').classList.remove('visible');document.getElementById('playBtn').classList.remove('active');document.getElementById('playBtn').textContent='▶ Read';document.getElementById('stopBtn').disabled=true;};synth.speak(utt);}
function toggleSpeak(){if(synth.speaking){if(synth.paused){synth.resume();document.getElementById('playBtn').textContent='❙❙ Pause';}else{synth.pause();document.getElementById('playBtn').textContent='▶ Resume';}return;}speak(getNarration(current));}
function toggleAuto(){autoMode=!autoMode;const btn=document.getElementById('autoBtn');btn.classList.toggle('active',autoMode);if(autoMode){btn.textContent='⏹ Stop Auto';speak(getNarration(current),scheduleNext);}else{btn.textContent='⟳ Auto';stopSpeak();}}
function scheduleNext(){if(!autoMode)return;autoTimer=setTimeout(()=>{if(current<slides.length-1){changeSlide(1);setTimeout(()=>speak(getNarration(current),scheduleNext),400);}else{autoMode=false;document.getElementById('autoBtn').classList.remove('active');document.getElementById('autoBtn').textContent='⟳ Auto';}},1200);}
function buildDots(){const c=document.getElementById('dots');c.innerHTML='';slides.forEach((_,i)=>{const d=document.createElement('button');d.className='dot'+(i===current?' active':'');d.onclick=()=>goTo(i);c.appendChild(d);});}
function render(idx){const s=slides[idx],inner=document.getElementById('inner'),card=document.getElementById('card');inner.classList.add('fade');setTimeout(()=>{if(idx===0){card.style.cssText='flex-direction:column;align-items:center;justify-content:center;text-align:center;';inner.innerHTML='<img src="'+DOG_SRC+'" class="title-dog" id="dogImg" alt="Professor Nugget"><div class="section-tag">'+s.tag+'</div><div class="big-title">'+s.title+'</div><div style="color:#ccc;line-height:1.7;font-size:14px;max-width:640px;margin:10px auto">'+s.body+'</div>';}else{card.style.cssText='flex-direction:row;align-items:flex-start;';inner.innerHTML='<div class="presenter"><div class="mouth-wrap"><img src="'+DOG_SRC+'" class="dog-img" id="dogImg" alt="Professor Nugget"><div class="mouth" id="dogMouth"><div class="mouth-inner"><div class="tongue"></div></div></div></div><span class="dog-name">🐾 Prof. Nugget</span><div class="speech-bubble" id="speechBubble">Woof!</div></div><div class="content"><div class="section-tag">'+s.tag+'</div><div class="slide-title">'+s.title+'</div><div class="slide-body">'+s.body+'</div></div>';}inner.classList.remove('fade');},220);document.getElementById('progress').style.width=((idx+1)/slides.length*100)+'%';document.getElementById('counter').textContent='Slide '+(idx+1)+' / '+slides.length;document.getElementById('prevBtn').disabled=idx===0;document.getElementById('nextBtn').textContent=idx===slides.length-1?'✓ Done':'Next →';buildDots();}
function goTo(idx){stopSpeak();autoMode=false;document.getElementById('autoBtn').classList.remove('active');document.getElementById('autoBtn').textContent='⟳ Auto';current=Math.max(0,Math.min(slides.length-1,idx));render(current);}
function changeSlide(dir){goTo(current+dir);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();changeSlide(1);}if(e.key==='ArrowLeft'){e.preventDefault();changeSlide(-1);}if(e.key==='r'||e.key==='R')toggleSpeak();});
if(!window.speechSynthesis)document.querySelector('.voice-controls').innerHTML='<span style="font-size:11px;color:#888">Voice not supported</span>';
render(0);

</script>
