<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Non-Parametric Tests — Professor Nugget</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { width: 960px; max-width: 98vw; padding: 16px; }
.progress-bar { height: 6px; background: #333; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #f7971e, #ffd200); border-radius: 3px; transition: width 0.4s ease; }
.top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.slide-counter { font-size: 12px; color: #888; }
.voice-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.voice-btn { background: transparent; border: 1px solid #555; border-radius: 6px; color: #ccc; font-size: 12px; padding: 4px 10px; cursor: pointer; transition: all 0.2s; }
.voice-btn:hover { border-color: #f7971e; color: #f7971e; }
.voice-btn.active { background: rgba(247,151,30,0.15); border-color: #f7971e; color: #f7971e; }
.voice-btn:disabled { opacity: 0.4; cursor: default; }
.speed-select { background: #1a1a2e; border: 1px solid #555; border-radius: 6px; color: #ccc; font-size: 12px; padding: 4px 6px; cursor: pointer; }
.speaking-indicator { display: none; align-items: center; gap: 4px; font-size: 11px; color: #f7971e; }
.speaking-indicator.visible { display: flex; }
.bar { width: 3px; background: #f7971e; border-radius: 2px; animation: bounce 0.6s infinite alternate; }
.bar:nth-child(1) { height: 8px; } .bar:nth-child(2) { height: 14px; animation-delay: 0.15s; } .bar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
@keyframes bounce { from { transform: scaleY(0.4); } to { transform: scaleY(1); } }
.card { background: #16213e; border-radius: 16px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: flex; gap: 24px; min-height: 340px; align-items: flex-start; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #f7971e, #ffd200); }
.presenter { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dog-img { width: 180px; height: 230px; object-fit: cover; border-radius: 12px; border: 3px solid #f7971e; box-shadow: 0 4px 16px rgba(247,151,30,0.3); transition: box-shadow 0.15s ease; }
.dog-img.talking { animation: dogTalk 0.35s ease-in-out infinite alternate; box-shadow: 0 0 0 4px #ffd200, 0 0 24px 8px rgba(247,151,30,0.6); }
@keyframes dogTalk { from { transform: scale(1) rotate(-1deg); } to { transform: scale(1.04) rotate(1deg); } }
.mouth-wrap { position: relative; display: inline-block; }
.mouth { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); width: 38px; height: 0; background: #1a0a00; border-radius: 0 0 14px 14px; border: 2px solid #8B4513; transition: height 0.12s ease; overflow: hidden; display: none; }
.mouth.open { height: 14px; }
.mouth-inner { width: 100%; height: 100%; background: linear-gradient(to bottom, #cc2200, #880000); border-radius: 0 0 12px 12px; }
.tongue { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 16px; height: 9px; background: #ff6688; border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%; }
.speech-bubble { position: relative; background: #ffd200; color: #000; font-size: 11px; font-weight: 800; border-radius: 10px; padding: 5px 10px; margin-top: 4px; text-align: center; display: none; animation: bubblePop 0.3s ease; }
.speech-bubble.visible { display: block; }
.speech-bubble::after { content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-bottom-color: #ffd200; }
@keyframes bubblePop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.dog-name { font-size: 11px; color: #f7971e; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.title-dog { width: 180px; height: 230px; border-radius: 14px; border: 4px solid #f7971e; box-shadow: 0 6px 30px rgba(247,151,30,0.4); margin: 14px auto; display: block; }
.title-dog.talking { animation: dogTalk 0.35s ease-in-out infinite alternate; box-shadow: 0 0 0 4px #ffd200, 0 0 30px 10px rgba(247,151,30,0.7); }
.content { flex: 1; min-width: 0; max-height: 72vh; overflow-y: auto; padding-right: 4px; }
.content::-webkit-scrollbar { width: 4px; } .content::-webkit-scrollbar-track { background: #0d1b2a; } .content::-webkit-scrollbar-thumb { background: #f7971e; border-radius: 2px; }
.section-tag { display: inline-block; background: rgba(247,151,30,0.15); color: #f7971e; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 6px; padding: 3px 10px; margin-bottom: 10px; border: 1px solid rgba(247,151,30,0.3); }
.slide-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 12px; line-height: 1.3; }
.slide-body { color: #ccc; line-height: 1.7; font-size: 14px; }
.slide-body p { margin-bottom: 10px; } .slide-body ul { padding-left: 18px; } .slide-body li { margin-bottom: 6px; } .slide-body strong { color: #ffd200; }
.slide-body table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.code-block { background: #0d1b2a; border-left: 3px solid #f7971e; border-radius: 8px; padding: 10px 14px; font-family: 'Cascadia Code','Fira Code',monospace; font-size: 12px; color: #a8d8ea; margin: 10px 0; overflow-x: auto; white-space: pre; line-height: 1.6; }
.kw { color: #c792ea; } .fn { color: #82aaff; } .str { color: #c3e88d; } .cm { color: #546e7a; font-style: italic; } .arg { color: #ffcb6b; }
.tip { background: rgba(130,210,255,0.08); border: 1px solid rgba(130,210,255,0.2); border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-size: 13px; color: #a8d8ea; }
.tip-label { font-weight: 700; color: #82aaff; }
.nav { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 12px; }
.btn { background: #f7971e; color: #000; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.btn:hover { background: #ffd200; transform: translateY(-1px); }
.btn:disabled { background: #444; color: #777; cursor: default; transform: none; }
.btn-outline { background: transparent; color: #f7971e; border: 2px solid #f7971e; }
.btn-outline:hover { background: #f7971e; color: #000; }
.dots { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #444; cursor: pointer; transition: all 0.2s; border: none; }
.dot.active { background: #f7971e; transform: scale(1.4); }
.dot:hover:not(.active) { background: #888; }
.card-inner { transition: opacity 0.25s ease; width: 100%; }
.card-inner.fade { opacity: 0; }
.big-title { font-size: 25px; font-weight: 800; background: linear-gradient(135deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="top-row">
    <div class="slide-counter" id="counter">Slide 1 / 9</div>
    <div class="voice-controls">
      <div class="speaking-indicator" id="speakingIndicator"><div class="bar"></div><div class="bar"></div><div class="bar"></div><span style="font-size:11px;margin-left:2px">Nugget is speaking…</span></div>
      <select class="speed-select" id="speedSelect"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select>
      <select class="speed-select" id="voiceSelect" title="Choose voice" style="max-width:140px"><option value="">Default voice</option></select>
      <button class="voice-btn" id="playBtn" onclick="toggleSpeak()">▶ Read</button>
      <button class="voice-btn" id="stopBtn" onclick="stopSpeak()" disabled>■ Stop</button>
      <button class="voice-btn" id="autoBtn" onclick="toggleAuto()">⟳ Auto</button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:11%"></div></div>
  <div class="card" id="card"><div class="card-inner" id="inner"></div></div>
  <div class="nav">
    <button class="btn btn-outline" id="prevBtn" onclick="changeSlide(-1)" disabled>← Back</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="nextBtn" onclick="changeSlide(1)">Next →</button>
  </div>
</div>

const slides = [{"tag": "Welcome", "title": "Non-Parametric Tests — A Unified Pipeline", "isTitle": true, "narration": "Woof woof! I am Nugget! I am a very good boy! I am also a very smart boy who knows about non-parametric statistics! That is very impressive for a dog! Most dogs just assume everything is normally distributed! But many real datasets are NOT normal — they are skewed, have outliers, or are ordinal. Non-parametric tests solve this by working with RANKS instead of raw values. An outlier of 1000 in a dataset of values around 5 becomes rank 10 — its extreme value is contained! Today we cover five tests: Wilcoxon signed-rank, Kruskal-Wallis, Friedman, Scheirer-Ray-Hare, and ART ANOVA. Each is the non-parametric equivalent of a classic parametric test! Let us go! Woof woof!", "body": "<p>Woof! I am <strong>Nugget</strong>! I am a very good boy! 🐾 Today I am teaching you about <strong>Non-Parametric Statistical Tests</strong>!</p><p><strong>Why non-parametric?</strong> No normality, no homogeneity of variance required — tests work on <strong>ranks</strong>:</p><ul><li>📊 Data not normally distributed or sample size too small for CLT</li><li>📋 Ordinal response variable (ranks are natural)</li><li>⚠️ Extreme outliers that cannot be removed</li></ul><p><strong>Three datasets:</strong> paired x/y vectors, <code>kruskal_wallis.csv</code> (FST by gene class), <code>Non_parametric_anova.csv</code> (task time × method × player)</p><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABQcAAAH+CAYAAAAh77j0AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAABAABJREFUeJzs3XV4VFf+x/H3aNyVBIcgwZ22lGKlCi2UUvetbt32V/futt126+7updRoKaW4uwaHQNx1fH5/DJkkJIGgAfJ5Pc8+28z AAKIU4SAAAAAAAAAQpQgHAQAAAAAAgChFOAgAAAAAAABEKcJBAAAAAAAAIEoRDgIAAAAAAABRinAQAAAAAAAAiFKEgwAAAAAAAECUIhwEAAAAAAAAohThIAAAAAAAABClCAcBAAAAAACAKEU4CAAAAAAAAEQpwkEAAAAAAAAgShEOAgAAAAAAAFGKcBAAAAAAAACIUoSDAAAAAAAAQJQiHAQAAAAAAACiFOEgAAAAAAAAEKUIBwEAAAAAAIAoRTgIAAAAAAAARKn/D4qWYuw9hyDeAAAAAElFTkSuQmCC\" style=\"width:100%;border-radius:6px;display:block;\"><div style=\"font-size:10px;color:#888;margin-top:5px;font-style:italic;\">Left: how ranking works — outlier value 15.0 becomes rank 10, bounded and non-influential. Right: test hierarchy — five non-parametric equivalents for five parametric designs.</div></div>"}, {"tag": "Section 1 · Libraries", "title": "Load Your Libraries", "narration": "Arf arf! Nugget is here! Nugget is ready! Section 1 loads ten packages organized into five groups. The non-parametric two-sample group: coin provides wilcox_test — a permutation-based Wilcoxon test with exact p-values via the coin framework. exactRankTests provides wilcox.exact — an exact Wilcoxon test specifically for when ties are present in the data. The blocked non-parametric group: SuppDists provides pFriedman — exact Friedman distribution p-values, which are more accurate than the chi-square approximation for small designs. The post-hoc and summarization group: FSA provides dunnTest — Dunn's post-hoc test for Kruskal-Wallis — and Summarize for grouped descriptive statistics. The two-way non-parametric group: rcompanion provides scheirerRayHare for the Scheirer-Ray-Hare two-way rank test and cldList for compact letter display from pairwise p-value tables. ARTool provides the art function for fitting Aligned Ranks Transformation models and art.con for ART contrasts. The post-hoc comparison group: emmeans for estimated marginal means from ART models, and multcomp for general linear hypothesis tests. Finally ggplot2 handles visualization. Woof!", "body": "<p>Ten packages in five groups — three specialized non-parametric packages:</p><div class='code-block'><span class='cm'># ── Two-sample non-parametric ────────────────────────────────────────</span>\n<span class='fn'>library</span>(<span class='str'>coin</span>)           <span class='cm'># wilcox_test() — permutation-based Wilcoxon</span>\n<span class='fn'>library</span>(<span class='str'>exactRankTests</span>)  <span class='cm'># wilcox.exact() — exact p-value when ties present</span>\n\n<span class='cm'># ── Blocked non-parametric ───────────────────────────────────────────</span>\n<span class='fn'>library</span>(<span class='str'>SuppDists</span>)       <span class='cm'># pFriedman() — exact Friedman p-values</span>\n\n<span class='cm'># ── Post-hoc and summarization ───────────────────────────────────────</span>\n<span class='fn'>library</span>(<span class='str'>FSA</span>)             <span class='cm'># dunnTest() — Dunn's post-hoc for Kruskal-Wallis</span>\n\n<span class='cm'># ── Two-way non-parametric ───────────────────────────────────────────</span>\n<span class='fn'>library</span>(<span class='str'>rcompanion</span>)      <span class='cm'># scheirerRayHare() + cldList() — CLD from p-values</span>\n<span class='fn'>library</span>(<span class='str'>ARTool</span>)          <span class='cm'># art() — ART model; art.con() — ART contrasts</span>\n\n<span class='cm'># ── Post-hoc comparisons ─────────────────────────────────────────────</span>\n<span class='fn'>library</span>(<span class='str'>emmeans</span>)         <span class='cm'># emmeans() for ART models</span>\n<span class='fn'>library</span>(<span class='str'>multcomp</span>)        <span class='cm'># glht() — general linear hypothesis tests</span>\n<span class='fn'>library</span>(<span class='str'>ggplot2</span>)         <span class='cm'># grammar-of-graphics plotting</span></div>"}, {"tag": "Section 2 · Wilcoxon", "title": "Wilcoxon Signed-Rank — Non-Parametric Paired t-Test", "narration": "Woof! I am such a smart boy! Yes I am! Section 2 is the Wilcoxon signed-rank test — the non-parametric equivalent of the paired t-test. It tests whether the MEDIAN of the differences between paired observations is zero, using the RANKS of those differences rather than their raw magnitudes. Use it when observations come in matched pairs — same subject before and after treatment, or matched controls — and the differences are not normally distributed, or n is too small to verify normality. The paired vectors x and y have 9 elements each — each element of x corresponds to the same subject as the same-position element of y. For a ONE-SIDED test with alternative equals less, test H1 that median y is LESS THAN median x. Use one-sided only when you have a specific directional hypothesis BEFORE seeing the data. For a TWO-SIDED test with conf.int equals TRUE, get a confidence interval for the pseudo-median of the differences — this is the Hodges-Lehmann estimator, a robust location shift estimate. When data contain TIES — identical values — use wilcox.exact from exactRankTests instead. The standard wilcox.test uses a normal approximation for tied data which can be inaccurate. wilcox.exact computes an exact p-value by enumeration and is slower but gives correct results for small samples or tied data. Woof!", "body": "<p>Non-parametric equivalent of the paired t-test — uses ranks of differences:</p><div class='code-block'><span class='cm'># Paired observations — position i of x and y are the same subject</span>\nx &lt;- <span class='fn'>c</span>(1.83, 0.50, 1.62, 2.48, 1.68, 1.88, 1.55, 3.06, 1.30)\ny &lt;- <span class='fn'>c</span>(0.878, 0.647, 0.598, 2.050, 1.060, 1.290, 1.060, 3.140, 1.290)\n\n<span class='cm'># One-sided test: H₁ = median(y) < median(x)</span>\n<span class='cm'># Use one-sided ONLY with an a priori directional hypothesis</span>\n<span class='fn'>wilcox.test</span>(y, x, <span class='arg'>paired</span>=TRUE, <span class='arg'>alternative</span>=<span class='str'>\"less\"</span>)\n\n<span class='cm'># Two-sided + CI: returns Hodges-Lehmann location shift estimate</span>\n<span class='fn'>wilcox.test</span>(y, x, <span class='arg'>paired</span>=TRUE, <span class='arg'>conf.int</span>=TRUE)\n\n<span class='cm'># Ties present? → use exact p-value (safer for small n)</span>\n<span class='cm'># wilcox.exact() enumerates rather than approximating — more accurate</span>\n<span class='fn'>wilcox.exact</span>(x, y, <span class='arg'>paired</span>=TRUE, <span class='arg'>alternative</span>=<span class='str'>\"greater\"</span>)</div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABW4AAAHGCAYAAADkNBKOAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAAA/KdJREFUeJzs3Xd8FNX6x/HPzPYEAqE3pYvSQYoCIlUERUAERUW99l6uDa/Ye//Zr+XaOyqoSO9Neu+9dwiEJNt3fn8sbAgkkISyCfm+X6/7um6dZybLnDnPnPMco3jluhYiIiIiIiIiIiIiUmCY8Q5ARERERERERERERLJS4lZERERERERERESkgFHiVkRERERERERERKSAUeJWREREREREREREpIBR4lZERERERERERESkgFHiVkRERERERERERKSAUeJWREREREREREREpIBR4lZERERERERERESkgFHiVkRERERERERERKSAUeJWREREREREREREpICxxzsAkfx4tK2fR9sGY493p8OyXTZen+hkxiZbrr/nve4+GlWMcPGnCaciTAC6nhPi674+zn8/gU37s79XclaJCHPuy4g99gZhT4bBou0mvy528NcyG2DEXn+0rZ+7LwhS/fVisecaVAjz2qV+6paPkOCAWm8k4g3Cm5f56VwrRJlEGDjKyacznadsX0VERE61wf0zaF01AkDEgq2pBjM22XhpvJPNObSz2Zl9bzqjV9l5YqTrVIXKC539dK0TotkHicd9b/saIe65MEijimEcNlizx+THBXa+nO0gbB37GqAwa1U1RPMqEd6dmvX65EzbTxGRU6V3/SC3NQ9Sq3QEw4BtBwxmbrLx8ngnuzOi7eLpaPPyo375MONu89LzWzfTNuScnto5MC3234EwbNlvMGa1nTcmOdnnM3L83IkoqMdMih4lbqXQyghC7+88AFQsbvHwRQF+u95Lp889LN+Vu+Tt21OcJDisUxlmnrw4zsnUDTYcNqiSFKFrnRD/6+1j+AobN//qjnXcvpvnYPSqrP98X+7ix2bCdT+58YUM0gLQr1GIPg1C3Peni/UpJpv2nZpGTURE5HSascnk2TEubAacVy7CgHZ+mlYK0+7TBLyh3LV1Nw1ys/8Udfby6q6WAZ7rHODv5Tbu+cNNRhA61gzzbKcAF1ULc9MgNxYFI9aTrXXVMHdfEDwqcZvdtY6IiGR174UBBnYI8MkMB69NdGIYcF7ZCL3rh6hQ3GL3wbFBBanNy6/PZjr4fYkdl92iddUwD7YOUqNU bution — H is approximately chi-squared distributed with k minus 1 degrees of freedom. A significant p-value means at least one group's rank distribution differs from the others. The real dataset kruskal_wallis.csv has FST — a population differentiation index — measured for genes in two classes: DNA and protein. The formula interface is FST tilde class with data equals non_anova. This is exactly the same formula syntax as aov — just swap aov for kruskal.test. After a significant Kruskal-Wallis result, you NEED a post-hoc test to identify WHICH groups differ. Dunn's test in Section 6 performs pairwise rank-sum comparisons with multiple-comparison correction. Never just do multiple pairwise Wilcoxon tests without correction — that inflates the Type I error rate. Woof!", "body": "<p>Extends rank-sum comparison to k ≥ 2 independent groups — same formula as <code>aov()</code>:</p><div class='code-block'><span class='cm'># Read the FST dataset</span>\nnon_anova &lt;- <span class='fn'>read.csv</span>(<span class='str'>\"kruskal_wallis.csv\"</span>, <span class='arg'>header</span>=TRUE)\n<span class='fn'>str</span>(non_anova)\n<span class='cm'># Columns: gene (name), class (DNA/protein), FST (response)</span>\n\n<span class='cm'># kruskal.test() — same formula interface as aov()</span>\n<span class='cm'># All observations ranked globally; H tests rank distribution equality</span>\n<span class='cm'># H₀: all groups have the same rank distribution (equal medians)</span>\nout_kw &lt;- <span class='fn'>kruskal.test</span>(FST ~ class, <span class='arg'>data</span>=non_anova)\n<span class='fn'>print</span>(out_kw)\n<span class='cm'># Output: H statistic, df = k-1, p-value</span>\n<span class='cm'># p < 0.05 → at least one group's rank distribution differs</span>\n\n<span class='cm'># Significant KW result → MUST do Dunn post-hoc (Section 6)</span>\n<span class='cm'># Do NOT do multiple wilcox.test() calls — inflates Type I error!</span></div><div style=\"margin-top:12px;backgrou  player — separately, then tests whether the rank distributions differ across treatment levels. This removes block-to-block differences in average time before comparing methods. The formula is time tilde method pipe player — the PIPE symbol separates the treatment factor from the blocking factor. The blocking variable player MUST be a factor — coerce with as.factor before fitting or R will not know how many unique blocks exist. After the chi-square approximation from friedman.test, use pFriedman from SuppDists to get the EXACT p-value from the Friedman distribution. This is more reliable when the number of blocks or treatments is small. The QUADE test is similar to Friedman but additionally WEIGHTS each block by its RANGE — the difference between maximum and minimum response within that block. Blocks with wider spread — more discriminating subjects — contribute more to the test. Quade is more powerful than Friedman for small k with 4 or fewer treatments. Use Summarize from FSA to check the spread per block before choosing between Friedman and Quade. Woof!", "body": "<p>Ranks within each block to remove between-block variation — two complementary tests:</p><div class='code-block'><span class='cm'># Read the repeated measures dataset</span>\nnon_anova_2 &lt;- <span class='fn'>read.csv</span>(<span class='str'>\"Non_parametric_anova.csv\"</span>, <span class='arg'>header</span>=TRUE)\n\n<span class='cm'># CRITICAL: player must be a factor for friedman.test() / quade.test()</span>\n<span class='cm'># Integer player → R doesn't know how many unique blocks exist</span>\nnon_anova_2$player &lt;- <span class='fn'>as.factor</span>(non_anova_2$player)\n\n<span class='cm'># Friedman test — formula: response ~ treatment | block</span>\n<span class='cm'># | (pipe) separates treatment from blocking factor</span>\n<span class='cm'># Rankings computed WITHIN each level of player → block effects removed</span>\nout_friedman &lt;- <span class='fn'>friedman.test</span>(time ~ method | player,\n                             <span class='arg'>data</span>=non_anova_2)\n\n<span class='cm'># Exact p-value (more accurate for small designs)</span>\n<span class='fn'>pFriedman</span>(out_friedman$statistic,\n          <span class='fn'>nlevels</span>(non_anova_2$method),   <span class='cm'># k = number of treatments</span>\n          <span class='fn'>nlevels</span>(non_anova_2$player),   <span class='cm'># n = number of blocks</span>\n          <span class='arg'>lower.tail</span>=FALSE)              <span class='cm'># upper-tail = p-value</span>\n\n<span class='cm'># Quade test: like Friedman but weights blocks by their range</span>\n<span class='cm'># More powerful than Friedman when k ≤ 4 and block ranges vary</span>\n<span class='fn'>Summarize</span>(time ~ player, <span class='arg'>data</span>=non_anova_2, <span class='arg'>digits</span>=3)\n<span class='fn'>quade.test</span>(time ~ method | player, <span class='arg'>data</span>=non_anova_2)</div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABJIAAAHGCAYAAAAvyqFZAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAAA601JREFUeJzs3Xd4VGXax/HvmZaZJKSQACH0Kh1BASuC2LCBHRB7XX1du2vva19dZXXdta0NFbH3hgUboPReAgQILb1Nn/P+MWSSIYUkBNJ+n+viIjNz5swz55yZc899nud+jDadBpiIiIiIiIiIiIjsgaWxGyAiIiIiIiIiIs2DEkkiIiIiIiIiIlIrSiSJiIiIiIiIiEitKJEkIiIiIiIiIiK1okSSiIiIiIiIiIjUihJJIiIiIiIiIiJSK0okiYiIiIiIiIhIrSiRJCIiIiIiIiIitaJEkoiIiIiIiIiI1IoSSSIiIiIiIiIiUiu2xm6ASEu2487iPS5zzccxTBrqp8RnMPUd135oVdUO6xbgw/M8HPuSi0VbrQ2+/ptHe7l5tD9yO7sEVuy08tiPDuZsCr/eOUP8TDvVS79/xJHrNhq8Dc3N5SN9PHicj/YPxle7TNl+Azjs37GszYm+PnDbGC/XH+EnM9/g4H/F1en1zxnixx+E95fZo+7/4LzSfXq8DuoQZNZlbia+7uTXjTpNiYg0JZOH+nn6FC+jno1lfV75OeeSg308fIKPJ36y89hPMZ within each player block. Right: within-block ranking for Player 1 — round < wide < narrow; these ranks are what the Friedman test actually uses.</div></div>"}, {"tag": "Section 5 · Scheirer-Ray-Hare", "title": "Scheirer-Ray-Hare — Non-Parametric Two-Way ANOVA", "narration": "Woof woof woof! I am a very excited boy! Section 5 is the Scheirer-Ray-Hare test — the non-parametric extension of a TWO-WAY ANOVA. All observations are ranked GLOBALLY together, then those ranks are partitioned using a standard two-way ANOVA sums-of-squares decomposition. The test produces p-values for each main effect and the interaction. The Star Wars midichlorian dataset has two factors: Tribe — Jedi or Sith — and Location — four cities — with 6 observations per Tribe times Location combination for a total of 24 observations. Create the dataset using rep and data.frame, then coerce both factors. The scheirerRayHare formula is Midichlorians tilde Tribe plus Location — note the PLUS not asterisk. Despite using plus, the function always tests the interaction automatically. The output rows are: Tribe main effect, Location main effect, and Tribe colon Location interaction. The H column is a Kruskal-Wallis-like rank statistic for each term. The Df column is the degrees of freedom. And the p.value column gives the significance. The important LIMITATION: Scheirer-Ray-Hare has lower power than ART ANOVA for detecting interactions. If the interaction is your primary question, use ART ANOVA from Section 7 instead. Woof!", "body": "<p>Two-way non-parametric test via global ranking + ANOVA SS decomposition:</p><div class='code-block'><span class='cm'># Simulate the Star Wars midichlorian dataset</span>\n<span class='cm'># 4 locations × 2 tribes × 3 obs = 24 observations</span>\nLocation &lt;- <span class='fn'>rep</span>(<span class='fn'>c</span>(<span class='str'>\"Olympia\"</span>,<span class='str'>\"Ventura\"</span>,<span class='str'>\"Northampton\"</span>,<span class='str'>\"Burlington\"</span>), <span class='arg'>each</span>=6)\nTribe    &lt;- <span class='fn'>rep</span>(<span class='fn'>c</span>(<span class='str'>\"Jedi\"</span>,<span class='str'>\"Sith\"</span>), <span class='arg'>times</span>=12)\nMidichlorians &lt;- <span class='fn'>c</span>(10,4,12,5,15,4, 15,9,15,11,18,12,\n                     8,13,8,15,10,17, 22,22,20,22,20,25)\nData &lt;- <span class='fn'>data.frame</span>(Tribe, Location, Midichlorians)\nData$Tribe    &lt;- <span class='fn'>as.factor</span>(Data$Tribe)\nData$Location &lt;- <span class='fn'>as.factor</span>(Data$Location)\n\n<span class='cm'># scheirerRayHare(): formula uses + (not *) — interaction always tested</span>\n<span class='cm'># Ranks all observations globally, then partitions by SS decomposition</span>\n<span class='fn'>scheirerRayHare</span>(Midichlorians ~ Tribe + Location, <span class='arg'>data</span>=Data)\n<span class='cm'># Output rows: Tribe | Location | Tribe:Location (interaction)</span>\n<span class='cm'># H = rank statistic, Df, p.value — p < 0.05 → term significant</span></div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABJQAAAHGCAYAAAAi1NEeAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAAAw2lJREFUeJzs3Xd4FOXXxvHvbMsmIZAGIYTeqyggVlDA3hARwYJdLNh7/2Gvr733XkARFRGkI9J77x1Cek+2z/vHQsKSAEkIJMD9uS4v2d3ZZ85MJtnds+c5jxGV1N5ERERERERERESknCzVHYCIiIiIiIiIiBxZlFASEREREREREZEKUUJJREREREREREQqRAklERERERERERGpECWURERERERERESkQpRQEhERERERERGRClFCSUREREREREREKkQJJRERERERERERqRAllEREREREREREpEKUUBIRERERERERkQpRQklkDw/1dJP6ZD6L7y7AwCz1+OjrCkl9Mp93LnaFPGfjw/kHHPvrAUX8Nriwws/b02+DC/luYNF+t2lUJ0Dqk/lc1NZXobEP13hVIfXJfO442XNIxj61iY/UJ/PpnOg/JONX1JDuHvq0KH3u591ZwEvnuqshosrZ/bu1v//m3VlQ5nPfudjF1CElvzsDj/OS+mQ+seGlf /iGDCIiIiJS8GnKm4iIiIiIiIiIOERT3kRERERERERExCFKKImIiIiIiIiIiEOUUBIREREREREREYcooSQiIiIiIiIiIg5RQklERERERERERByihJKIiIiIiIiIiDhECSUREREREREREXGIEkoiIiIiIiIiIuIQJZRERERERERERMQhSiiJiIiIiIiIiIhD/g9LNxijucGMXgAAAABJRU5ErkJggg==\" style=\"width:100%;border-radius:6px;display:block;\"><div style=\"font-size:10px;color:#888;margin-top:5px;font-style:italic;\">Left: midichlorians by Location × Tribe — Burlington much higher; Jedi/Sith patterns differ by location. Right: SRH vs ART ANOVA comparison — ART is superior for interaction detection and handles repeated measures.</div></div>"}, {"tag": "Section 6 · Dunn Post-Hoc", "title": "Dunn's Test & Compact Letter Display", "narration": "Sniff sniff... Nugget will now explain Dunn's test and compact letter displays! Section 6 performs pairwise comparisons after a significant Kruskal-Wallis or Scheirer-Ray-Hare test. Before running dunnTest, ORDER the Location factor levels by their median Midichlorian value using tapply and sort. tapply applies the median function to Midichlorians grouped by Location, sort orders those medians from lowest to highest, and names extracts the location names in that order. Then reassign the factor levels using factor with levels equals ordered_locations. Ordering by median is conventional for non-parametric comparisons because the median is the location parameter being tested. dunnTest from FSA takes the formula Midichlorians tilde Location with data equals Data and method equals bh for Benjamini-Hochberg false discovery rate correction. BH is less conservative than Bonferroni — it controls the EXPECTED proportion of false positives among rejected tests — and is preferred when many comparisons are made and some true differences are expected, such as in ecological or breeding datasets. Other options include bonferroni for family-wise error control and none for unadjusted exploratory inspection only. The result DT has a groups data frame and a res data frame. Extract res as PT. Then cldList from rcompanion converts the adjusted pairwise p-value table into compact letter groupings. The formula is P.adj tilde Comparison with threshold equals 0.05. Groups sharing a letter are not significantly different. Woof!", "body": "<p>Pairwise rank comparisons after significant KW or SRH — with multiple-comparison correction:</p><div class='code-block'><span class='cm'># Order Location by median before post-hoc — conventional for non-parametric</span>\nlocation_medians  &lt;- <span class='fn'>tapply</span>(Data$Midichlorians, Data$Location, median)\nordered_locations &lt;- <span class='fn'>names</span>(<span class='fn'>sort</span>(location_medians))\nData$Location &lt;- <span class='fn'>factor</span>(Data$Location, <span class='arg'>levels</span>=ordered_locations)\n\n<span class='cm'># dunnTest() — pairwise Dunn comparisons (rank-sum based)</span>\n<span class='cm'># method = 'bh' — Benjamini-Hochberg FDR correction</span>\n<span class='cm'>#   'bh'         → controls expected false discovery rate (FDR)</span>\n<span class='cm'>#   'bonferroni' → controls family-wise error rate (FWER); more conservative</span>\n<span class='cm'>#   'none'       → unadjusted; exploratory only</span>\nDT &lt;- <span class='fn'>dunnTest</span>(Midichlorians ~ Location,\n              <span class='arg'>data</span>=Data, <span class='arg'>method</span>=<span class='str'>\"bh\"</span>)\nPT &lt;- DT$res  <span class='cm'># Comparison, Z, P.unadj, P.adj columns</span>\n\n<span class='cm'># cldList(): P.adj table → compact letter display</span>\n<span class='cm'># Groups sharing a letter are NOT significantly different</span>\n<span class='fn'>cldList</span>(P.adj ~ Comparison,\n         <span class='arg'>data</span>=PT, <span class='arg'>threshold</span>=0.05)</div><div class='tip'><span class='tip-label'>💡 BH vs Bonferroni:</span> Bonferroni controls family-wise error — probability ANY test is a false positive — and is very conservative. BH controls false discovery rate — expected proportion of false positives among rejected tests — and has more power when many comparisons are made. Use Bonferroni for confirmatory studies; BH for discovery-oriented research.</div>"}, {"tag": "Section 7 · ART ANOVA", "title": "ART ANOVA — Aligned Ranks Transformation", "narration": "Rowf! I am a very good boy and I know about ART ANOVA! Section 7 is the most powerful non-parametric approach for factorial designs. ART — Aligned Ranks Transformation — extends Scheirer-Ray-Hare by properly handling interactions. Each term is tested using its OWN aligned and ranked version of the data, rather than a single global ranking. art from ARTool fits the model. The formula syntax is Midichlorians tilde Tribe plus Location plus Tribe colon Location. The ASTERISK shorthand is NOT supported in art — specify the interaction term explicitly using the colon operator. Internally, art creates a separate aligned-and-ranked response for EACH term, then fits a standard linear model to each. The alignment removes the effects of all other terms before ranking that term's response. Print the art object to check alignment success: all F-values for non-tested terms should be near zero. If any are large, the alignment failed — inspect the data for imbalance. Call anova of model_art to get F-tests for each term. Then compute partial eta-squared from the ANOVA table using SS_effect divided by SS_effect plus SS_residual. For post-hoc comparisons, art.con of model_art with the factor name performs ART-specific pairwise contrasts. IMPORTANT: the estimate column from art.con is in RANK units — do not interpret as an original-scale difference. Focus on p-values and letter groupings only. Woof!", "body": "<p>Most powerful non-parametric approach for factorial designs with interactions:</p><div class='code-block'><span class='cm'># art() — IMPORTANT: use + and : explicitly; * NOT supported!</span>\n<span class='cm'># Internally: one aligned+ranked response per term</span>\nmodel_art &lt;- <span class='fn'>art</span>(Midichlorians ~ Tribe + Location + Tribe:Location,\n                <span class='arg'>data</span>=Data)\n\n<span class='cm'># Check alignment — all F-values for non-tested terms should be ≈ 0</span>\n<span class='fn'>print</span>(model_art)\n\n<span class='cm'># ANOVA table: F-test per term using its own aligned-ranked data</span>\nResult &lt;- <span class='fn'>anova</span>(model_art)\n<span class='fn'>print</span>(Result)\n\n<span class='cm'># Partial η² effect size: SS_effect / (SS_effect + SS_residual)</span>\n<span class='cm'># Small < 0.06  |  Medium 0.06–0.14  |  Large ≥ 0.14</span>\nResult$part.eta.sq &lt;- <span class='fn'>with</span>(Result,\n  `Sum Sq` / (`Sum Sq` + `Sum Sq.res`))\n\n<span class='cm'># Post-hoc: art.con() — estimates in RANK units, not original scale!</span>\nmarginal_loc &lt;- <span class='fn'>art.con</span>(model_art, <span class='str'>\"Location\"</span>)\n<span class='fn'>cldList</span>(p.value ~ contrast,\n         <span class='arg'>data</span>=<span class='fn'>as.data.frame</span>(marginal_loc), <span class='arg'>threshold</span>=0.05)\n\n<span class='cm'># Interaction contrasts: Tribe effect at each Location level</span>\n<span class='fn'>art.con</span>(model_art, <span class='str'>\"Tribe:Location\"</span>, <span class='arg'>adjust</span>=<span class='str'>\"none\"</span>)</div><div style=\"margin-top:12px;background:#0d1b2a;border-radius:10px;padding:10px;border:1px solid #334;\"><div style=\"font-size:10px;color:#f7971e;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;\">📊 Output</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABH4AAAHFCAYAAACEgD4IAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAQ6wAAEOsBUJTofAAAz6BJREFUeJzs3XV8leX/x/HXffqsNxiD0d0liIigIogtiqKIXxXs7sbuzp8dWNiJKCoqioh0dzcDxjpO378/DpwxWFIL3s/Hg8dj587rvs/Z2P3e57ouI7ZhBxMREREREREREal1LFXdABEREREREREROTgU/IiIiIiIiIiI1FIKfkREREREREREaikFPyIiIiIiIiIitZSCHxERERERERGRWkr 2y7THa/HOmG8Y0r8Hv/yQPf9O+OIV/LF4xXXX91/+Rfzsq/hlWSwcPHyM10Z/Zt//5XdTGTG0Lwumj+efrbv4e+X6HD0U89PkmfMY+mxPpo7/mITEJOaFL6XaRROCz1nwF68M6cujD97P2o1b+WDsBF4d/RlD+/eg46SviE9M4oeps/knH3rc5QeDb8lq+dVbU0RERERE5Lp9//loZvwazpIVax0diuST4QOfYcWaTTc0sfHlfPvp28z8NZy/8zgB8MXOL7P9/Mtv52Nk4mwaN7ibZ3uF0e3ZlxwdynXRUC8REREREXGIe+6q+e/KTiYee7gZJUKDCyRBII7zyVc/FsgzrVurGkGBAaxa90++1y0S4F+EWtUqYzAYCCkWSPfObQt1W9NQLxERERERcYjKFe/gtRefxc3VlROnzvDG+2NvaLiV3B4+efsVKt5Rlk/HTbxkNS2R/GAyGRncvzslQoJJS09n7catTJo5z9FhXTcN9RIRERERERERcVIa6iUiIiIiIiIi4qSU+BERERERERERcVJK/IiIiIiIiIiIOCklfkREREREREREnJQSPyIiIiIiIiIiTkqJHxERERERERERJ6XEj4iIiIiIiIiIk1LiR0RERERERETESSnxIyIiIiIiIiLipP4PwcJVgwYodAUAAAAASUVORK5CYII=\" style=\"width:100%;border-radius:6px;display:block;\"><div style=\"font-size:10px;color:#888;margin-top:5px;font-style:italic;\">Left: partial η² interpretation scale — Tribe (0.32), Location (0.58), Tribe:Location (0.11) are all large effects. Right: Dunn post-hoc CLD for Location — Burlington (a) differs from all others; Olympia (c) lowest; Northampton and Ventura share letters.</div></div>"}, {"tag": "Section 8 · Summary", "title": "Key Concepts Decision Guide", "narration": "I am a very excited boy! I love decision guides! The final slide is the master summary for non-parametric tests. Twelve key concepts. One: non-parametric tests work on RANKS not raw values — an outlier of 1000 in a dataset of 5s becomes rank 10, bounded and non-influential. Two: use non-parametric when normality is clearly violated, sample size is below 10, the response is ordinal, or extreme outliers cannot be removed. Three: Wilcoxon signed-rank is the paired t-test equivalent — use wilcox.exact when ties are present or n is small. Four: Kruskal-Wallis is one-way ANOVA equivalent — global ranking, H statistic, chi-square df of k minus 1. Five: significant Kruskal-Wallis MUST be followed by Dunn's test — never do multiple pairwise Wilcoxon tests without correction. Six: Friedman is repeated measures ANOVA equivalent — ranks WITHIN each block, pipe notation for blocking variable, player must be a factor. Seven: Quade is like Friedman but weights blocks by range — more powerful for k less than or equal to 4. Eight: Scheirer-Ray-Hare is two-way ANOVA equivalent — uses plus not asterisk, always tests interaction, but has lower power for interactions than ART. Nine: ART ANOVA is the best for factorial designs — uses explicit colon notation, one aligned-ranked response per term, check alignment success before interpreting. Ten: art.con estimates are in RANK units only — never interpret as original-scale differences. Eleven: dunnTest with method equals bh for BH correction preferred for discovery-oriented research; bonferroni for confirmatory. Twelve: cldList converts pairwise p-value tables to compact letter displays — groups sharing a letter are not significantly different. Nugget is done! I am a very good boy! I explained everything! Yes I did! Woof woof woof!", "body": "<p>Twelve key concepts — your non-parametric tests checklist:</p><ul><li>1️⃣ <strong>Ranks, not raw values</strong> → outlier 1000 becomes rank 10; bounded and non-influential</li><li>2️⃣ <strong>When to use</strong> → violated normality, n &lt; 10, ordinal response, unremovable outliers</li><li>3️⃣ <strong>Wilcoxon signed-rank</strong> → paired; use <code>wilcox.exact()</code> for ties or small n</li><li>4️⃣ <strong>Kruskal-Wallis</strong> → one-way; global ranking; H ~ χ² with df = k−1</li><li>5️⃣ <strong>Post-KW → dunnTest()</strong> → never multiple wilcox.test() without correction!</li><li>6️⃣ <strong>Friedman</strong> → repeated measures; ranks WITHIN blocks; <code>player</code> must be <code>factor</code>!</li><li>7️⃣ <strong>Quade</strong> → like Friedman + block-range weighting; better power for k ≤ 4</li><li>8️⃣ <strong>Scheirer-Ray-Hare</strong> → two-way; <code>+</code> not <code>*</code>; always tests interaction; lower interaction power</li><li>9️⃣ <strong>ART ANOVA</strong> → best for factorial; explicit <code>Tribe:Location</code> notation; check alignment F ≈ 0</li><li>🔟 <strong>art.con() estimates = RANK units</strong> → do NOT interpret as original-scale differences!</li><li>1️⃣1️⃣ <strong>method='bh' (FDR)</strong> → discovery research; <code>'bonferroni'</code> (FWER) → confirmatory</li><li>1️⃣2️⃣ <strong>cldList(P.adj ~ Comparison)</strong> → shared letter = not significantly different</li></ul><table style='width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;'><thead><tr style='background:#1a3a5c;'><th style='padding:6px;border:1px solid #334;color:#f7971e;'>Design</th><th style='padding:6px;border:1px solid #334;color:#f7971e;'>Non-parametric test</th><th style='padding:6px;border:1px solid #334;color:#f7971e;'>R function</th><th style='padding:6px;border:1px solid #334;color:#f7971e;'>Post-hoc</th></tr></thead><tbody><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>Paired samples</td><td style='padding:5px;border:1px solid #334;color:#f7971e;'>Wilcoxon signed-rank</td><td style='padding:5px;border:1px solid #334;color:#a8d8ea;font-family:monospace;font-size:11px;'>wilcox.test() / wilcox.exact()</td><td style='padding:5px;border:1px solid #334;color:#ccc;'>—</td></tr><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>One-way independent</td><td style='padding:5px;border:1px solid #334;color:#f7971e;'>Kruskal-Wallis</td><td style='padding:5px;border:1px solid #334;color:#a8d8ea;font-family:monospace;font-size:11px;'>kruskal.test()</td><td style='padding:5px;border:1px solid #334;color:#ccc;'>dunnTest() + cldList()</td></tr><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>One-way blocked</td><td style='padding:5px;border:1px solid #334;color:#f7971e;'>Friedman / Quade</td><td style='padding:5px;border:1px solid #334;color:#a8d8ea;font-family:monospace;font-size:11px;'>friedman.test() / quade.test()</td><td style='padding:5px;border:1px solid #334;color:#ccc;'>—</td></tr><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>Two-way independent</td><td style='padding:5px;border:1px solid #334;color:#f7971e;'>Scheirer-Ray-Hare</td><td style='padding:5px;border:1px solid #334;color:#a8d8ea;font-family:monospace;font-size:11px;'>scheirerRayHare()</td><td style='padding:5px;border:1px solid #334;color:#ccc;'>dunnTest() + cldList()</td></tr><tr style='background:#16213e;'><td style='padding:5px;border:1px solid #334;color:#ccc;'>Two-way + interaction</td><td style='padding:5px;border:1px solid #334;color:#f7971e;'>ART ANOVA</td><td style='padding:5px;border:1px solid #334;color:#a8d8ea;font-family:monospace;font-size:11px;'>art() + anova() + art.con()</td><td style='padding:5px;border:1px solid #334;color:#ccc;'>art.con() + cldList()</td></tr></tbody></table>"}];

const dogIntros=['Woof woof! I am a very good boy! ','Arf arf! Nugget is here! Nugget is ready! ','Woof! I am such a smart boy! Yes I am! Yes I am! ','Ruff ruff! I am a very good boy AND a very good professor! ','Arf! Nugget knows this one! Nugget is so helpful! ','Woof woof woof! I am a very excited boy! ','Rowf! I am a very good boy and I know non-parametric statistics! That is impressive for a dog! ','Woof! Yes yes yes! Nugget can explain this! I am such a good boy! '];
const barks=['Woof!','Arf!','Ruff!','Woof woof!','Grr... woof!','Arf arf!','Rowf!','Woof woof woof!'];
function getNarration(idx){const s=slides[idx];const intro=dogIntros[idx%dogIntros.length];const outros=[' Nugget is such a good teacher! Woof!',' I am a very good boy for explaining this! Woof woof!',' Yes yes yes! Nugget did it! I am so helpful!',' That is a very good slide! Nugget is very proud! Woof!',' I am a very smart boy! Did you know that? Yes! Woof woof!',' Nugget knows so many things! I am a very good boy!'];const isLast=idx===slides.length-1;const outro=isLast?' Nugget is done! I am a very good boy! I explained everything! Yes I did! Woof woof woof!':outros[idx%outros.length];return intro+(s.narration||'')+outro;}
let current=0,autoMode=false,autoTimer=null,mouthTimer=null;
const synth=window.speechSynthesis;
function populateVoices(){const voices=synth.getVoices();const sel=document.getElementById('voiceSelect');if(!sel)return;sel.innerHTML='<option value="">Default voice</option>';voices.forEach((v,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=v.name+' ('+v.lang+')';if(v.name.includes('Google UK English Male')||v.name==='Alex'||v.name==='Fred')opt.selected=true;sel.appendChild(opt);});}
if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=populateVoices;
populateVoices();
function getSelectedVoice(){const sel=document.getElementById('voiceSelect');if(!sel||sel.value==='')return null;return synth.getVoices()[parseInt(sel.value)]||null;}
function setTalking(on){const img=document.getElementById('dogImg'),mouth=document.getElementById('dogMouth'),bubble=document.getElementById('speechBubble');if(!img)return;if(on){img.classList.add('talking');if(mouth)mouth.style.display='block';if(bubble){bubble.classList.add('visible');bubble.textContent=barks[Math.floor(Math.random()*barks.length)];}if(mouthTimer)clearInterval(mouthTimer);let open=false;mouthTimer=setInterval(()=>{open=!open;if(mouth)mouth.classList.toggle('open',open);if(open&&bubble&&Math.random()>0.7)bubble.textContent=barks[Math.floor(Math.random()*barks.length)];},180);}else{img.classList.remove('talking');if(mouth){mouth.classList.remove('open');mouth.style.display='none';}if(bubble)bubble.classList.remove('visible');if(mouthTimer){clearInterval(mouthTimer);mouthTimer=null;}}}
function stopSpeak(){synth.cancel();setTalking(false);document.getElementById('speakingIndicator').classList.remove('visible');document.getElementById('playBtn').classList.remove('active');document.getElementById('playBtn').textContent='▶ Read';document.getElementById('stopBtn').disabled=true;if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
function speak(text,onEnd){synth.cancel();const utt=new SpeechSynthesisUtterance(text);utt.rate=1.0;utt.pitch=0.9;utt.volume=1;const sv=getSelectedVoice();if(sv)utt.voice=sv;document.getElementById('speakingIndicator').classList.add('visible');document.getElementById('playBtn').classList.add('active');document.getElementById('playBtn').textContent='❙❙ Pause';document.getElementById('stopBtn').disabled=false;setTalking(true);utt.onend=()=>{setTalking(false);document.getElementById('speakingIndicator').classList.remove('visible');document.getElementById('playBtn').classList.remove('active');document.getElementById('playBtn').textContent='▶ Read';document.getElementById('stopBtn').disabled=true;if(onEnd)onEnd();};utt.onerror=()=>{setTalking(false);document.getElementById('speakingIndicator').classList.remove('visible');document.getElementById('playBtn').classList.remove('active');document.getElementById('playBtn').textContent='▶ Read';document.getElementById('stopBtn').disabled=true;};synth.speak(utt);}
function toggleSpeak(){if(synth.speaking){if(synth.paused){synth.resume();document.getElementById('playBtn').textContent='❙❙ Pause';}else{synth.pause();document.getElementById('playBtn').textContent='▶ Resume';}return;}speak(getNarration(current));}
function toggleAuto(){autoMode=!autoMode;const btn=document.getElementById('autoBtn');btn.classList.toggle('active',autoMode);if(autoMode){btn.textContent='⏹ Stop Auto';speak(getNarration(current),scheduleNext);}else{btn.textContent='⟳ Auto';stopSpeak();}}
function scheduleNext(){if(!autoMode)return;autoTimer=setTimeout(()=>{if(current<slides.length-1){changeSlide(1);setTimeout(()=>speak(getNarration(current),scheduleNext),400);}else{autoMode=false;document.getElementById('autoBtn').classList.remove('active');document.getElementById('autoBtn').textContent='⟳ Auto';}},1200);}
function buildDots(){const c=document.getElementById('dots');c.innerHTML='';slides.forEach((_,i)=>{const d=document.createElement('button');d.className='dot'+(i===current?' active':'');d.onclick=()=>goTo(i);c.appendChild(d);});}
function render(idx){const s=slides[idx],inner=document.getElementById('inner'),card=document.getElementById('card');inner.classList.add('fade');setTimeout(()=>{if(idx===0){card.style.cssText='flex-direction:column;align-items:center;justify-content:center;text-align:center;';inner.innerHTML='<img src="'+DOG_SRC+'" class="title-dog" id="dogImg" alt="Professor Nugget"><div class="section-tag">'+s.tag+'</div><div class="big-title">'+s.title+'</div><div style="color:#ccc;line-height:1.7;font-size:14px;max-width:640px;margin:10px auto">'+s.body+'</div>';}else{card.style.cssText='flex-direction:row;align-items:flex-start;';inner.innerHTML='<div class="presenter"><div class="mouth-wrap"><img src="'+DOG_SRC+'" class="dog-img" id="dogImg" alt="Professor Nugget"><div class="mouth" id="dogMouth"><div class="mouth-inner"><div class="tongue"></div></div></div></div><span class="dog-name">🐾 Prof. Nugget</span><div class="speech-bubble" id="speechBubble">Woof!</div></div><div class="content"><div class="section-tag">'+s.tag+'</div><div class="slide-title">'+s.title+'</div><div class="slide-body">'+s.body+'</div></div>';}inner.classList.remove('fade');},220);document.getElementById('progress').style.width=((idx+1)/slides.length*100)+'%';document.getElementById('counter').textContent='Slide '+(idx+1)+' / '+slides.length;document.getElementById('prevBtn').disabled=idx===0;document.getElementById('nextBtn').textContent=idx===slides.length-1?'✓ Done':'Next →';buildDots();}
function goTo(idx){stopSpeak();autoMode=false;document.getElementById('autoBtn').classList.remove('active');document.getElementById('autoBtn').textContent='⟳ Auto';current=Math.max(0,Math.min(slides.length-1,idx));render(current);}
function changeSlide(dir){goTo(current+dir);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();changeSlide(1);}if(e.key==='ArrowLeft'){e.preventDefault();changeSlide(-1);}if(e.key==='r'||e.key==='R')toggleSpeak();});
if(!window.speechSynthesis)document.querySelector('.voice-controls').innerHTML='<span style="font-size:11px;color:#888">Voice not supported</span>';
render(0);

</script>
